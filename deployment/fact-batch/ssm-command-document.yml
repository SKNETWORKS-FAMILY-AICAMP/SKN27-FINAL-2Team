schemaVersion: '2.2'
description: Generate HiMate Fact-Graph questions and upload review artifacts to S3.
parameters:
  Region:
    type: String
    description: AWS region containing ECR, Parameter Store, and the S3 bucket.
    allowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]+$'
  FactBatchImageUri:
    type: String
    description: Immutable ECR image URI including its sha256 digest.
    allowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9]+([._/-][a-z0-9]+)*@sha256:[0-9a-f]{64}$'
  SpecS3Uri:
    type: String
    description: S3 URI of the reviewed Graph Pack specification JSON.
    allowedPattern: '^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9._/-]+$'
  OutputS3Prefix:
    type: String
    description: S3 prefix where review artifacts are uploaded.
    allowedPattern: '^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9._/-]+$'
  ExistingBankS3Uri:
    type: String
    description: Optional S3 URI of a reviewed pack bank used to reject reused facts.
    default: ''
    allowedPattern: '^$|^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9._/-]+$'
  ParameterPrefix:
    type: String
    description: Parameter Store path containing production batch settings.
    default: /himate/prod
    allowedPattern: '^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$'
  VariantsPerPack:
    type: String
    description: Number of question variants generated from each approved pack.
    default: '1'
    allowedPattern: '^[1-9][0-9]*$'
  MockExam:
    type: String
    description: Whether the output must satisfy mock-exam distribution constraints.
    default: 'false'
    allowedValues:
      - 'true'
      - 'false'
  MaxTotalCalls:
    type: String
    description: Maximum model calls per generated question.
    default: '28'
    allowedPattern: '^[1-9][0-9]*$'
  MaxSeconds:
    type: String
    description: Maximum processing seconds per generated question.
    default: '600'
    allowedPattern: '^[1-9][0-9]*$'
  DependencyTimeoutSeconds:
    type: String
    description: Maximum time to wait for PostgreSQL and Fact Neo4j readiness.
    default: '300'
    allowedPattern: '^[1-9][0-9]*$'
  DependencyRetryIntervalSeconds:
    type: String
    description: Interval between dependency readiness checks.
    default: '5'
    allowedPattern: '^[1-9][0-9]*$'
  Seed:
    type: String
    description: Deterministic generation seed.
    default: '20260715'
    allowedPattern: '^[0-9]+$'
mainSteps:
  - action: aws:runShellScript
    name: runFactQuestionGeneration
    inputs:
      timeoutSeconds: '86400'
      runCommand:
        - |-
          #!/usr/bin/env bash
          set -euo pipefail

          umask 077
          export AWS_DEFAULT_REGION='{{ Region }}'

          image_uri='{{ FactBatchImageUri }}'
          spec_s3_uri='{{ SpecS3Uri }}'
          output_s3_prefix='{{ OutputS3Prefix }}'
          existing_bank_s3_uri='{{ ExistingBankS3Uri }}'
          parameter_prefix='{{ ParameterPrefix }}'

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          repository_image="${image_uri#"${registry}/"}"
          if [[ "${repository_image}" == "${image_uri}" ]] \
            || [[ ! "${repository_image}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*@sha256:[0-9a-f]{64}$ ]]; then
            echo 'FactBatchImageUri must be a digest-pinned image in this AWS account and region.' >&2
            exit 1
          fi

          work_root='/var/lib/himate/fact-batch'
          install -d -m 0700 "${work_root}"
          work_directory="$(mktemp -d "${work_root}/run.XXXXXXXX")"
          environment_file="${work_directory}/batch.env"
          completed='false'

          cleanup() {
            rm -f -- "${environment_file}"
            docker logout "${registry}" > /dev/null 2>&1 || true
            if [[ "${completed}" == 'true' ]]; then
              rm -rf -- "${work_directory}"
            elif [[ -d "${work_directory}" ]]; then
              echo "Fact batch failed; non-secret work files remain at ${work_directory}." >&2
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          install -d -m 0750 "${work_directory}/input" "${work_directory}/output"
          aws s3 cp "${spec_s3_uri}" "${work_directory}/input/spec.json" --only-show-errors

          existing_bank_arguments=()
          if [[ -n "${existing_bank_s3_uri}" ]]; then
            aws s3 cp "${existing_bank_s3_uri}" "${work_directory}/input/existing-bank.json" --only-show-errors
            existing_bank_arguments=(
              --env FACT_BATCH_EXISTING_BANK_PATH=/work/input/existing-bank.json
            )
          fi

          parameter_names=(
            POSTGRES_DB
            POSTGRES_HOST
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_PORT
            POSTGRES_CONNECT_TIMEOUT_SECONDS
            POSTGRES_SSLMODE
            POSTGRES_SSLROOTCERT
            FACT_NEO4J_URI
            FACT_NEO4J_USER
            FACT_NEO4J_PASSWORD
            OPENAI_API_KEY
            OPENAI_CHAT_MODEL
            RUNPOD_ENDPOINT_ID
            RUNPOD_API_KEY
            RUNPOD_SLLM_MODEL
          )
          for parameter_name in "${parameter_names[@]}"; do
            parameter_value="$(
              aws ssm get-parameter \
                --name "${parameter_prefix}/${parameter_name}" \
                --with-decryption \
                --query Parameter.Value \
                --output text
            )"
            if [[ -z "${parameter_value}" \
              || "${parameter_value}" == *$'\n'* \
              || "${parameter_value}" == *$'\r'* ]]; then
              echo "Parameter is empty or contains a line break: ${parameter_prefix}/${parameter_name}" >&2
              exit 1
            fi
            printf '%s=%s\n' "${parameter_name}" "${parameter_value}" >> "${environment_file}"
          done

          chown 10001:10001 "${work_directory}"
          chown -R 10001:10001 "${work_directory}/input" "${work_directory}/output"
          chmod 0750 "${work_directory}" "${work_directory}/input" "${work_directory}/output"
          chown root:root "${environment_file}"
          chmod 0600 "${environment_file}"

          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${registry}" > /dev/null
          docker pull "${image_uri}" > /dev/null

          docker run \
            --rm \
            --network host \
            --read-only \
            --tmpfs '/tmp:rw,nosuid,nodev,noexec,size=64m' \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env-file "${environment_file}" \
            --env FACT_BATCH_SPEC_PATH=/work/input/spec.json \
            --env FACT_BATCH_OUTPUT_DIR=/work/output \
            --env 'FACT_BATCH_VARIANTS_PER_PACK={{ VariantsPerPack }}' \
            --env 'FACT_BATCH_MOCK_EXAM={{ MockExam }}' \
            --env 'FACT_BATCH_MAX_TOTAL_CALLS={{ MaxTotalCalls }}' \
            --env 'FACT_BATCH_MAX_SECONDS={{ MaxSeconds }}' \
            --env 'FACT_BATCH_SEED={{ Seed }}' \
            --env 'FACT_BATCH_DEPENDENCY_TIMEOUT_SECONDS={{ DependencyTimeoutSeconds }}' \
            --env 'FACT_BATCH_DEPENDENCY_RETRY_INTERVAL_SECONDS={{ DependencyRetryIntervalSeconds }}' \
            "${existing_bank_arguments[@]}" \
            --volume "${work_directory}:/work:rw" \
            "${image_uri}"

          run_id="$(date -u +%Y%m%dT%H%M%SZ)-$(basename "${work_directory}")"
          destination_uri="${output_s3_prefix%/}/${run_id}/"
          aws s3 cp \
            "${work_directory}/output" \
            "${destination_uri}" \
            --recursive \
            --only-show-errors

          completed='true'
          echo "Fact batch review artifacts uploaded to ${destination_uri}"
