<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 문제풀이</title>
  <link rel="stylesheet" href="/static/question/css/exam.css" />
  <link rel="stylesheet" href="../../static/question/css/exam.css" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
</head>
<body>
  <header class="site-header" aria-label="문제풀이 메뉴">
    <a class="brand site-brand" href="/" aria-label="himate 홈">
      <img src="/static/chatbot/assets/logo.png" alt="himate" data-fallback-src="../../static/chatbot/assets/logo.png" />
    </a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a href="/diagnosis/">진단 평가</a>
      <a class="active" href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a href="/user/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      <a class="ghost-button" href="/user/logout/">로그아웃</a>
    </nav>
  </header>

  <main class="exam-page">
    <section class="exam-shell" aria-label="문제 풀이">
      <header class="exam-header">
        <div class="exam-title">
          <span>문제풀이</span>
          <h1>문제 풀이</h1>
        </div>
        <div class="progress-box" aria-label="문항 진행률">
          <strong>문항 수</strong>
          <div class="progress-track"><span id="progressFill" style="width: 5%"></span></div>
          <em id="progressText">1 / 20</em>
        </div>
      </header>

      <div class="exam-layout">
        <section class="question-panel">
          <div class="question-meta">
            <span class="question-badge" id="questionBadge">문항 번호 1</span>
            <span class="question-type" id="questionType">한국사 기본 개념</span>
          </div>

          <article class="question-card">
            <p class="question-label">문제</p>
            <h2 id="questionTitle">다음 중 흥선 대원군의 정책으로 옳은 것은?</h2>
            <div class="question-source" id="questionSource">
              세도 정치의 폐단을 바로잡고 왕권을 강화하기 위한 개혁 정책을 추진하였다.
            </div>

            <div class="choice-list" id="choiceList" role="radiogroup" aria-label="선택지">
              <button type="button" class="choice" data-choice="1" aria-pressed="false"><span>1</span><b>비변사의 기능을 강화하였다.</b></button>
              <button type="button" class="choice" data-choice="2" aria-pressed="false"><span>2</span><b>서원을 대폭 정리하였다.</b></button>
              <button type="button" class="choice" data-choice="3" aria-pressed="false"><span>3</span><b>당백전 발행을 중단하였다.</b></button>
              <button type="button" class="choice" data-choice="4" aria-pressed="false"><span>4</span><b>통리기무아문을 설치하였다.</b></button>
              <button type="button" class="choice" data-choice="5" aria-pressed="false"><span>5</span><b>대한제국 수립을 선포하였다.</b></button>
            </div>
          </article>

          <footer class="question-actions">
            <button class="nav-button" id="prevButton" type="button">이전</button>
            <button class="submit-button" id="submitButton" type="button">제출</button>
            <button class="nav-button next" id="nextButton" type="button">다음</button>
          </footer>
        </section>

        <aside class="side-panel" aria-label="문제풀이 상태">
          <section class="save-card">
            <button id="saveProgressButton" type="button">문제 저장</button>
            <p id="saveStatus">풀이 중인 문제를 저장할 수 있습니다.</p>
          </section>

          <section class="timer-card">
            <span>남은 시간</span>
            <strong id="timerText">20:00</strong>
          </section>

          <section class="number-card">
            <h2>문항 목록</h2>
            <div class="number-grid" aria-label="문항 번호">
              <button class="active" type="button" data-index="0">1</button>
              <button type="button" data-index="1">2</button>
              <button type="button" data-index="2">3</button>
              <button type="button" data-index="3">4</button>
              <button type="button" data-index="4">5</button>
              <button type="button" data-index="5">6</button>
              <button type="button" data-index="6">7</button>
              <button type="button" data-index="7">8</button>
              <button type="button" data-index="8">9</button>
              <button type="button" data-index="9">10</button>
              <button type="button" data-index="10">11</button>
              <button type="button" data-index="11">12</button>
              <button type="button" data-index="12">13</button>
              <button type="button" data-index="13">14</button>
              <button type="button" data-index="14">15</button>
              <button type="button" data-index="15">16</button>
              <button type="button" data-index="16">17</button>
              <button type="button" data-index="17">18</button>
              <button type="button" data-index="18">19</button>
              <button type="button" data-index="19">20</button>
            </div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll("img[data-fallback-src]").forEach((image) => {
      image.addEventListener("error", () => {
        if (image.dataset.fallbackTried) return;
        image.dataset.fallbackTried = "1";
        image.src = image.dataset.fallbackSrc;
      });
    });

    const defaultQuestions = [

        choices: ["비변사의 기능을 강화하였다.", "서원을 대폭 정리하였다.", "당백전 발행을 중단하였다.", "통리기무아문을 설치하였다.", "대한제국 수립을 선포하였다."],
      },

        choices: ["첨성대", "무령왕릉", "팔만대장경", "불국사 삼층석탑", "경천사지 십층석탑"],
      },
      {
        type: "고려 정치",
        title: "고려 시대 최충헌 집권 이후 설치된 권력 기구는?",
        source: "무신 집권기에는 최고 권력자의 사적 권력 기구가 정치 운영에 큰 영향력을 행사하였다.",
        choices: ["정방", "도병마사", "교정도감", "식목도감", "삼사"],
      },

      {
        type: "현대사",
        title: "대한민국 정부 수립과 관련된 사건으로 옳은 것은?",

      },
      {
        type: "경제사",

        choices: ["벽란도 번성", "덕대의 광산 경영", "녹읍 부활", "관료전 지급", "전시과 시행"],
      },

        type: "사상사",
        title: "조선 후기 실학자 정약용의 저술은?",

        choices: ["목민심서", "동국통감", "삼국유사", "성학십도", "해동고승전"],
      },
      {
        type: "고대 사회",
        title: "고구려의 제가 회의에 해당하는 정치 회의는?",
        source: "고구려에서는 귀족들이 국가 중대사를 논의하는 회의체가 있었다.",
        choices: ["화백 회의", "정사암 회의", "제가 회의", "도병마사", "만장일치제"],
      },
      {
        type: "통일 신라",
        title: "통일 신라의 지방 행정 제도는?",
        source: "신문왕 시기 왕권 강화와 함께 지방 제도가 정비되었다.",
        choices: ["9주 5소경", "5도 양계", "8도", "23부", "13도"],
      },
      {
        type: "고려 문화",
        title: "고려 불교 문화와 관련된 유산으로 옳은 것은?",
        source: "몽골 침입 시기 부처의 힘으로 외적을 물리치려는 염원을 담았다.",
        choices: ["팔만대장경", "직지심체요절", "상감 청자", "무령왕릉", "분황사 모전석탑"],
      },
      {
        type: "조선 정치",
        title: "사림의 향촌 자치와 관련된 기구는?",
        source: "조선 시대 사림은 향촌 사회에서 여론 형성과 자치 활동을 전개하였다.",
        choices: ["유향소", "중추원", "삼별초", "교정도감", "도평의사사"],
      },
      {
        type: "조선 후기",
        title: "영조가 붕당 간 대립을 완화하기 위해 시행한 정책은?",
        source: "왕권 안정과 정치 균형을 위해 여러 당파를 고르게 등용하려 하였다.",
        choices: ["탕평책", "북벌론", "척화비 건립", "균역법 폐지", "사창제"],
      },

        source: "1876년 조선이 일본과 맺은 근대적 조약이지만 불평등한 조항을 포함하였다.",
        choices: ["최초의 근대적 불평등 조약", "청과 맺은 조공 조약", "대한제국 헌법", "을사늑약 폐기 조약", "국권 회복 선언"],
      },
      {
        type: "독립운동",
        title: "대한민국 임시정부가 수립된 도시는?",
        source: "3·1 운동 이후 독립운동을 통합적으로 이끌기 위한 정부가 세워졌다.",
        choices: ["상하이", "베이징", "도쿄", "블라디보스토크", "경성"],
      },
      {
        type: "민주화",
        title: "1987년 대통령 직선제 개헌의 계기가 된 사건은?",
        source: "국민적 민주화 요구가 확산되며 6·29 선언과 헌법 개정으로 이어졌다.",
        choices: ["6월 민주 항쟁", "4·19 혁명", "부마 민주 항쟁", "5·18 민주화 운동", "3·1 운동"],
      },
      {
        type: "통일 정책",
        title: "1972년에 발표된 남북 간 합의는?",
        source: "자주, 평화, 민족 대단결의 통일 원칙을 담은 공동 성명이 발표되었다.",
        choices: ["7·4 남북 공동 성명", "6·15 남북 공동 선언", "10·4 선언", "남북 기본 합의서", "한반도 비핵화 공동 선언"],
      },
      {
        type: "종합",
        title: "다음 중 시대 순서가 바르게 나열된 것은?",
        source: "한국사의 주요 사건을 시간 순서대로 파악하는 문제이다.",
        choices: ["강화도 조약 - 갑오개혁 - 3·1 운동", "3·1 운동 - 갑오개혁 - 강화도 조약", "갑오개혁 - 강화도 조약 - 3·1 운동", "강화도 조약 - 3·1 운동 - 갑오개혁", "3·1 운동 - 강화도 조약 - 갑오개혁"],
      },
    ];

    const savedProgress = JSON.parse(localStorage.getItem("questionInProgress") || "null");
    const shouldResume = new URLSearchParams(window.location.search).get("resume") === "1";
    const questions = shouldResume && savedProgress?.questions?.length ? savedProgress.questions : defaultQuestions;
    let currentIndex = shouldResume && Number.isInteger(savedProgress?.currentIndex) ? savedProgress.currentIndex : 0;
    const answers = shouldResume && savedProgress?.answers?.length ? savedProgress.answers : Array(questions.length).fill(null);
    const questionBadge = document.getElementById("questionBadge");
    const questionType = document.getElementById("questionType");
    const questionTitle = document.getElementById("questionTitle");
    const questionSource = document.getElementById("questionSource");
    const choiceList = document.getElementById("choiceList");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const numberButtons = [...document.querySelectorAll(".number-grid button")];
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const submitButton = document.getElementById("submitButton");
    const timerText = document.getElementById("timerText");
    const saveProgressButton = document.getElementById("saveProgressButton");
    const saveStatus = document.getElementById("saveStatus");
    let remainingSeconds = shouldResume && Number.isInteger(savedProgress?.remainingSeconds) ? savedProgress.remainingSeconds : 20 * 60;
    let isTimeOver = false;

    function currentSession(status = "in_progress") {
      return {
        condition: savedProgress?.condition || JSON.parse(localStorage.getItem("questionGenerationCondition") || "null"),
        questions,
        answers,
        currentIndex,
        remainingSeconds,
        status,
        savedAt: new Date().toISOString(),
      };
    }

    function saveProgress(showMessage = true) {
      localStorage.setItem("questionInProgress", JSON.stringify(currentSession()));

      if (showMessage) {
        saveStatus.textContent = "현재 풀이 상태가 저장되었습니다.";
        saveStatus.classList.add("is-saved");
      }
    }

    function finishExam() {
      localStorage.setItem("questionResult", JSON.stringify({
        questions,
        answers,
        submittedAt: new Date().toISOString(),
        condition: savedProgress?.condition || JSON.parse(localStorage.getItem("questionGenerationCondition") || "null"),
      }));
      localStorage.removeItem("questionInProgress");
      window.location.href = "/question/result/";
    }

    function renderQuestion() {
      const question = questions[currentIndex];
      questionBadge.textContent = `문항 번호 ${currentIndex + 1}`;
      questionType.textContent = question.type;
      questionTitle.textContent = question.title;
      questionSource.textContent = question.source;
      progressFill.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      progressText.textContent = `${currentIndex + 1} / ${questions.length}`;
      choiceList.innerHTML = question.choices.map((choice, index) => {
        const number = index + 1;
        const selected = answers[currentIndex] === number;
        return `
          <button type="button" class="choice${selected ? " selected" : ""}" data-choice="${number}" aria-pressed="${selected ? "true" : "false"}">
            <span>${number}</span><b>${choice}</b>
          </button>
        `;
      }).join("");

      numberButtons.forEach((button, index) => {
        button.hidden = index >= questions.length;
        button.classList.toggle("active", index === currentIndex);
        button.classList.toggle("answered", answers[index] !== null);
      });

      prevButton.disabled = currentIndex === 0;
      nextButton.textContent = currentIndex === questions.length - 1 ? "마지막" : "다음";
      bindChoiceButtons();
    }

    function bindChoiceButtons() {
      document.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => {
          if (isTimeOver) return;
          answers[currentIndex] = Number(button.dataset.choice);
          saveProgress(false);
          renderQuestion();
        });
      });
    }

    function moveQuestion(nextIndex) {
      if (isTimeOver) return;
      if (nextIndex < 0 || nextIndex >= questions.length) return;
      currentIndex = nextIndex;
      saveProgress(false);
      renderQuestion();
    }

    prevButton.addEventListener("click", () => moveQuestion(currentIndex - 1));
    nextButton.addEventListener("click", () => moveQuestion(currentIndex + 1));
    submitButton.addEventListener("click", () => {
      if (isTimeOver) return;
      answers[currentIndex] = answers[currentIndex] ?? null;
      numberButtons[currentIndex].classList.add("answered");
      finishExam();
    });
    saveProgressButton.addEventListener("click", () => saveProgress(true));
    numberButtons.forEach((button) => {
      button.addEventListener("click", () => moveQuestion(Number(button.dataset.index)));
    });

    renderQuestion();

    function renderTimer() {
      const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
      const seconds = String(remainingSeconds % 60).padStart(2, "0");
      timerText.textContent = `${minutes}:${seconds}`;
      timerText.classList.toggle("is-warning", remainingSeconds <= 60 && remainingSeconds > 0);
    }

    function finishExamByTime() {
      isTimeOver = true;
      timerText.textContent = "00:00";
      timerText.classList.remove("is-warning");
      timerText.classList.add("is-over");
      document.querySelectorAll(".choice, .number-grid button, .nav-button, .submit-button").forEach((button) => {
        button.disabled = true;
      });
      submitButton.textContent = "시간 종료";
      finishExam();
    }

    renderTimer();
    const timerId = setInterval(() => {
      remainingSeconds -= 1;
      if (remainingSeconds <= 0) {
        clearInterval(timerId);
        remainingSeconds = 0;
        finishExamByTime();
        return;
      }
      renderTimer();
    }, 1000);
  </script>
</body>
</html>
