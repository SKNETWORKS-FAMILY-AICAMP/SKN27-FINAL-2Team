<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 문제 생성</title>
  <link rel="stylesheet" href="/static/question/css/create.css" />
  <link rel="stylesheet" href="../../static/question/css/create.css" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
</head>
<body>
  <header class="site-header" aria-label="문제풀이 메뉴">
    <a class="brand" href="/" aria-label="himate 홈">himate</a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a href="/diagnosis/">진단 평가</a>
      <a class="active" href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a href="/analytics/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      {% if request.user.is_authenticated %}
        <a class="ghost-button" href="/user/logout/">로그아웃</a>
      {% else %}
        <a class="pill-button" href="/user/login/">로그인</a>
      {% endif %}
    </nav>
  </header>

  <main class="create-page">
    <section class="create-shell" aria-label="문제 생성 조건">
      <header class="create-title">


      </header>

      <section class="mode-panel" aria-label="문제 생성 방식">
        <label class="mode-card">
          <input type="radio" name="questionMode" value="study_plan" />
          <span>학습 계획 문제 풀기</span>
          <strong>나의 학습실 학습 플래너에서 전달한 조건으로 문제를 생성합니다.</strong>
        </label>
        <label class="mode-card selected">
          <input type="radio" name="questionMode" value="detail" checked />
          <span>상세 설정</span>
          <strong>시대, 주제, 유형을 직접 선택</strong>
        </label>
      </section>

      <section class="condition-panel is-hidden" id="detailConditionPanel">
        <div class="condition-row" data-select-type="multiple">
          <h2>시대</h2>
          <div class="option-list">
            <button type="button" data-value="선사 시대">선사 시대</button>
            <button type="button" data-value="고조선">고조선</button>
            <button type="button" data-value="초기 국가">초기 국가</button>
            <button type="button" data-value="삼국 시대">삼국 시대</button>
            <button type="button" data-value="남북국 시대">남북국 시대</button>
            <button type="button" data-value="고려">고려</button>
            <button type="button" data-value="조선">조선</button>
            <button type="button" data-value="개항기">개항기</button>
            <button type="button" data-value="일제 강점기">일제 강점기</button>
            <button type="button" data-value="현대">현대</button>
          </div>
        </div>

        <div class="condition-row" data-select-type="multiple">
          <h2>주제</h2>
          <div class="option-list">
            <button type="button" data-value="정치">정치</button>
            <button type="button" data-value="경제">경제</button>
            <button type="button" data-value="사회">사회</button>
            <button type="button" data-value="문화">문화</button>
            <button type="button" data-value="인물">인물</button>
            <button type="button" data-value="군사">군사</button>
            <button type="button" data-value="외교">외교</button>
            <button type="button" data-value="사상·종교">사상·종교</button>
            <button type="button" data-value="제도">제도</button>
            <button type="button" data-value="사건">사건</button>
          </div>
        </div>

        <div class="condition-row" data-select-type="single">
          <h2>난이도</h2>
          <div class="option-list compact">
            <button type="button" data-value="상">상</button>
            <button type="button" data-value="중">중</button>
            <button type="button" data-value="하">하</button>
          </div>
        </div>

        <div class="condition-row" data-select-type="single">
          <h2>문제 수</h2>
          <div class="option-list compact">
            <button type="button" data-value="10" class="selected">10</button>
            <button type="button" data-value="20">20</button>
            <button type="button" data-value="30">30</button>
            <button type="button" data-value="40">40</button>
            <button type="button" data-value="50">50</button>
          </div>
        </div>

        <div class="condition-row" data-select-type="multiple">
          <h2>대유형</h2>
          <div class="option-list">
            <button type="button" data-value="역사 지식의 이해">역사 지식의 이해</button>
            <button type="button" data-value="연대기의 파악">연대기의 파악</button>
            <button type="button" data-value="역사 상황 및 쟁점의 인식">역사 상황 및 쟁점의 인식</button>
            <button type="button" data-value="역사 자료의 분석 및 해석">역사 자료의 분석 및 해석</button>
            <button type="button" data-value="역사 탐구의 설계 및 수행">역사 탐구의 설계 및 수행</button>
            <button type="button" data-value="결론의 도출 및 평가">결론의 도출 및 평가</button>
          </div>
        </div>

        <div class="condition-row" data-select-type="multiple">
          <h2>소유형</h2>
          <div class="option-list">
            <button type="button" data-value="연표">연표</button>
            <button type="button" data-value="사료">사료</button>
            <button type="button" data-value="개념">개념</button>
            <button type="button" data-value="인물">인물</button>
            <button type="button" data-value="지역">지역</button>
          </div>
        </div>
      </section>

      <footer class="create-actions">
        <div class="left-actions is-hidden" id="detailActionButtons">
          <button class="secondary-button" id="resetButton" type="button">초기화</button>
          <button class="secondary-button" id="selectAllButton" type="button">전체 선택</button>
        </div>
        <div>
          <button class="primary-button" id="createButton" type="button">문제지 생성</button>
          {% if request.user.is_authenticated %}
          <button class="outline-button" id="loadButton" type="button">문제 불러오기</button>
          {% endif %}
        </div>
      </footer>
    </section>

    <div class="saved-session-modal is-hidden" id="savedSessionModal" role="dialog" aria-modal="true" aria-labelledby="savedSessionTitle">
      <section class="saved-session-dialog">
        <header>
          <div>
            <span>Saved Exams</span>
            <h2 id="savedSessionTitle">저장된 문제지 선택</h2>
          </div>
          <button type="button" id="closeSavedSessionModal" aria-label="닫기">×</button>
        </header>
        <div class="saved-session-groups">
          <section>
            <h3>문제 풀이</h3>
            <div class="saved-session-list" data-session-list="practice"></div>
          </section>
          <section>
            <h3>학습 계획 문제 풀이</h3>
            <div class="saved-session-list" data-session-list="study_plan"></div>
          </section>
        </div>
      </section>
    </div>

    <div class="study-plan-modal is-hidden" id="studyPlanModal" role="dialog" aria-modal="true" aria-labelledby="studyPlanModalTitle">
      <section class="study-plan-dialog">
        <header>
          <div>
            <span>Study Plan</span>
            <h2 id="studyPlanModalTitle">오늘의 계획 선택</h2>
          </div>
          <button type="button" id="closeStudyPlanModal" aria-label="닫기">×</button>
        </header>
        <div class="study-plan-list" id="studyPlanList"></div>
      </section>
    </div>
  </main>

  {{ planner_data|json_script:"planner-data" }}
  <script>
    const rows = document.querySelectorAll(".condition-row");
    const resetButton = document.getElementById("resetButton");
    const selectAllButton = document.getElementById("selectAllButton");
    const createButton = document.getElementById("createButton");
    const loadButton = document.getElementById("loadButton");
    const detailConditionPanel = document.getElementById("detailConditionPanel");
    const detailActionButtons = document.getElementById("detailActionButtons");
    const modeCards = document.querySelectorAll(".mode-card");
    const modeInputs = document.querySelectorAll('input[name="questionMode"]');
    const savedSessionModal = document.getElementById("savedSessionModal");
    const closeSavedSessionModal = document.getElementById("closeSavedSessionModal");
    const studyPlanModal = document.getElementById("studyPlanModal");
    const closeStudyPlanModal = document.getElementById("closeStudyPlanModal");
    const studyPlanList = document.getElementById("studyPlanList");
    const plannerData = JSON.parse(document.getElementById("planner-data").textContent);
    const todayKey = "{{ planner_summary.today_key }}";
    const todayStudyPlans = (plannerData.plansByDate?.[todayKey] || [])
      .filter((plan) => plan && plan.isWeeklyReview !== true);

    const filterMap = {
      "시대": "eras",
      "주제": "topics",
      "난이도": "difficulties",
      "문제 수": "counts",
      "대유형": "question_types",
      "소유형": "question_subtypes",
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function rowByLabel(label) {
      return [...rows].find((row) => row.querySelector("h2").textContent.trim() === label);
    }

    function renderOptions(row, values) {
      if (!row || !values?.length) return;

      const label = row.querySelector("h2").textContent.trim();
      const optionList = row.querySelector(".option-list");
      const isSingle = row.dataset.selectType === "single";
      optionList.innerHTML = values.map((value, index) => {
        const selected = isSingle && label === "문제 수" && index === 0 ? " selected" : "";
        return `<button type="button" data-value="${value}" class="${selected.trim()}">${value}</button>`;
      }).join("");

      optionList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          if (isSingle) {
            optionList.querySelectorAll("button").forEach((item) => item.classList.remove("selected"));
            button.classList.add("selected");
            return;
          }
          button.classList.toggle("selected");
        });
      });
    }

    async function loadFilterOptions() {
      try {
        const response = await fetch("/question/api/filters/", {
          credentials: "same-origin",
        });
        const payload = await response.json();
        if (!response.ok) return;

        Object.entries(filterMap).forEach(([label, key]) => {
          renderOptions(rowByLabel(label), payload[key]);
        });
      } catch (error) {
        console.error(error);
      }
    }

    rows.forEach((row) => {
      row.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          if (row.dataset.selectType === "single") {
            row.querySelectorAll("button").forEach((item) => item.classList.remove("selected"));
            button.classList.add("selected");
            return;
          }

          button.classList.toggle("selected");
        });
      });
    });

    function collectCondition() {
      const condition = {};

      rows.forEach((row) => {
        const key = row.querySelector("h2").textContent.trim();
        const selected = [...row.querySelectorAll(".selected")].map((button) => button.dataset.value);
        condition[key] = row.dataset.selectType === "single" ? selected[0] || null : selected;
      });

      return condition;
    }

    function selectedMode() {
      return document.querySelector('input[name="questionMode"]:checked')?.value || "detail";
    }

    function buildStudyPlanCondition(plan) {
      return {
        generationMode: "study_plan",
        studyPlanId: plan.studyPlanId,
        studyPlanBlockId: plan.blockId,
        count: Number(plan.questionCount || 10),
        classification: plan.classification || "",
        label: plan.label || plan.title || "",
        title: plan.title || "",
        meta: plan.meta || "",
      };
    }

    function closeStudyPlanSelector() {
      studyPlanModal?.classList.add("is-hidden");
    }

    function renderStudyPlanSelector() {
      if (!studyPlanList) return;

      const selectablePlans = todayStudyPlans.filter((plan) => (
        plan.canStart !== false && plan.studyPlanId && plan.blockId
      ));
      if (!selectablePlans.length) {
        studyPlanList.innerHTML = `
          <p class="study-plan-empty">오늘 선택할 수 있는 학습 계획 문제가 없습니다.</p>
          <a class="outline-button" href="/analytics/mypage/">나의 학습실로 이동</a>
        `;
        return;
      }

      studyPlanList.innerHTML = selectablePlans.map((plan, index) => `
        <button class="study-plan-item" type="button" data-plan-index="${index}">
          <strong>${escapeHtml(plan.title || plan.label || "학습 계획")}</strong>
          <span>${escapeHtml(plan.meta || "")}</span>
          <em>${Number(plan.achievedCount || 0)}/${Number(plan.questionCount || 0)}문항</em>
        </button>
      `).join("");

      studyPlanList.querySelectorAll(".study-plan-item").forEach((button) => {
        button.addEventListener("click", () => {
          const plan = selectablePlans[Number(button.dataset.planIndex)];
          if (!plan) return;
          const condition = buildStudyPlanCondition(plan);
          sessionStorage.setItem("questionGenerationCondition", JSON.stringify(condition));
          sessionStorage.setItem("studyPlanQuestionCondition", JSON.stringify(condition));
          localStorage.removeItem("questionGenerationCondition");
          localStorage.removeItem("questionInProgress");
          window.location.href = "/question/exam/?new=1";
        });
      });
    }

    function openStudyPlanSelector() {
      renderStudyPlanSelector();
      studyPlanModal?.classList.remove("is-hidden");
    }

    function updateModeView() {
      const mode = selectedMode();
      modeCards.forEach((card) => {
        card.classList.toggle("selected", card.querySelector("input").checked);
      });
      const showDetail = mode === "detail";
      detailConditionPanel.classList.toggle("is-hidden", !showDetail);
      detailActionButtons.classList.toggle("is-hidden", !showDetail);
    }

    resetButton.addEventListener("click", () => {
      rows.forEach((row) => {
        row.querySelectorAll("button").forEach((button) => button.classList.remove("selected"));
      });

      document.querySelector('[data-value="10"]').classList.add("selected");
    });

    selectAllButton.addEventListener("click", () => {
      rows.forEach((row) => {
        const label = row.querySelector("h2").textContent.trim();
        const buttons = [...row.querySelectorAll("button")];

        buttons.forEach((button) => button.classList.remove("selected"));

        if (label === "문제 수") {
          const count50Button = buttons.find((button) => button.dataset.value === "50");
          (count50Button || buttons.at(-1))?.classList.add("selected");
          return;
        }

        if (label === "난이도") {
          const middleButton = buttons.find((button) => button.dataset.value === "중");
          (middleButton || buttons[0])?.classList.add("selected");
          return;
        }

        buttons.forEach((button) => button.classList.add("selected"));
      });
    });

    modeInputs.forEach((input) => {
      input.addEventListener("change", updateModeView);
    });

    async function hasInProgressSession() {
      if (!loadButton) return false;
      try {
        const response = await fetch("/question/api/sessions/in-progress/", {
          credentials: "same-origin",
        });
        if (!response.ok) return false;
        const payload = await response.json();
        return !!payload.sessions?.length;
      } catch (error) {
        console.error(error);
        return false;
      }
    }

    createButton.addEventListener("click", async () => {
      const mode = selectedMode();

      if (mode === "study_plan") {
        openStudyPlanSelector();
        return;
      }

      const condition = collectCondition();

      if (mode === "detail") {
        condition.generationMode = "detail";
        const requiredLabels = ["시대", "주제", "대유형", "소유형", "난이도"];
        const hasMissingCondition = requiredLabels.some((label) => {
          const value = condition[label];
          return Array.isArray(value) ? value.length === 0 : !value;
        });
        if (hasMissingCondition) {
          alert("시대, 주제, 대유형, 소유형, 난이도를 모두 선택해 주세요.");
          return;
        }
      }

      const hasInProgress = await hasInProgressSession();
      if (hasInProgress) {
        const shouldCreateNew = confirm("풀다 만 문제가 있습니다. 새 문제를 생성하면 기존 진행 기록은 삭제됩니다. 계속하시겠습니까?");
        if (!shouldCreateNew) return;
      }

      sessionStorage.setItem("questionGenerationCondition", JSON.stringify(condition));
      localStorage.removeItem("questionGenerationCondition");
      localStorage.removeItem("questionInProgress");
      window.location.href = "/question/exam/?new=1";
    });

    function closeSavedSessions() {
      savedSessionModal?.classList.add("is-hidden");
    }

    function renderSavedSessionList(type, sessions) {
      const list = savedSessionModal?.querySelector(`[data-session-list="${type}"]`);
      if (!list) return;
      if (!sessions.length) {
        list.innerHTML = '<p class="saved-session-empty">저장된 문제지가 없습니다.</p>';
        return;
      }

      list.innerHTML = sessions.map((session) => `
        <button class="saved-session-item" type="button" data-session-type="${type}" data-session-id="${session.session_id}">
          <span>${session.total_count}문항 · ${session.answered_count || 0}문항 풀이</span>
          <small>${session.recorded_date || ""}</small>
        </button>
      `).join("");

      list.querySelectorAll(".saved-session-item").forEach((button) => {
        button.addEventListener("click", () => {
          const sessionId = button.dataset.sessionId;
          window.location.href = `/question/exam/?resume=1&session_id=${sessionId}`;
        });
      });
    }

    async function fetchJson(url) {
      const response = await fetch(url, { credentials: "same-origin" });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || "저장된 문제지를 불러오지 못했습니다.");
      }
      return payload;
    }

    // 일반 문제풀이와 학습계획 문제풀이의 진행 중 세션을 모달에 나눠 표시한다.
    async function openSavedSessionModal() {
      try {
        const questionPayload = await fetchJson("/question/api/sessions/in-progress/");
        const questionSessions = questionPayload.sessions || [];
        renderSavedSessionList(
          "practice",
          questionSessions.filter((session) => session.session_source !== "study_plan")
        );
        renderSavedSessionList(
          "study_plan",
          questionSessions.filter((session) => session.session_source === "study_plan")
        );
        savedSessionModal?.classList.remove("is-hidden");
      } catch (error) {
        alert(error.message);
      }
    }

    if (loadButton) {
      loadButton.addEventListener("click", openSavedSessionModal);
    }
    closeSavedSessionModal?.addEventListener("click", closeSavedSessions);
    savedSessionModal?.addEventListener("click", (event) => {
      if (event.target === savedSessionModal) {
        closeSavedSessions();
      }
    });
    closeStudyPlanModal?.addEventListener("click", closeStudyPlanSelector);
    studyPlanModal?.addEventListener("click", (event) => {
      if (event.target === studyPlanModal) {
        closeStudyPlanSelector();
      }
    });

    loadFilterOptions();
    updateModeView();
  </script>
</body>
</html>
