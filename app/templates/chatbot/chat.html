{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate 한국사 챗봇</title>
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
  <link rel="stylesheet" href="{% static 'chatbot/css/chat.css' %}?v=hanok-chat-13" />
  <link rel="stylesheet" href="{% static 'chatbot/css/chat-reference.css' %}?v=11" />
</head>
<body>
  <main class="chat-page">
    <header class="chat-header" aria-label="챗봇 메뉴">
      <a class="brand" href="/" aria-label="himate 홈">himate</a>
      <nav class="main-nav" aria-label="학습 메뉴">
        <a href="/diagnosis/">진단 평가</a>
        <a href="/question/">문제 풀이</a>
        <a class="active" href="/chatbot/">챗봇</a>
        <a href="/analytics/mypage/">나의 학습실</a>
      </nav>
      <nav class="header-actions" aria-label="계정 메뉴">
        {% if request.user.is_authenticated %}
          <a class="ghost-button" href="/user/logout/">로그아웃</a>
        {% else %}
          <a class="pill-button" href="/user/login/">로그인</a>
        {% endif %}
      </nav>
    </header>

    <section class="messages">
      <div class="chat-layout">
        <button class="chat-sidebar-toggle is-active" id="chatSidebarToggle" type="button" aria-controls="chatSidebar" aria-expanded="true" aria-label="대화 목록 접기"></button>
        <aside class="left-sidebar session-sidebar" id="chatSidebar" aria-label="저장된 대화 세션">
          <button class="new-session-button" id="newSessionButton" type="button">+ 새 채팅</button>
          <label class="session-search">
            <span>채팅 검색</span>
            <input id="sessionSearchInput" type="search" placeholder="대화 검색" />
          </label>

          <div class="session-top">
            <h2 class="side-title">최근 대화</h2>
          </div>
          <div class="session-list" id="sessionList" aria-label="저장된 세션 목록"></div>
        </aside>

        <section class="chat-panel" aria-label="챗봇 대화">
          <div class="chat-stream" id="chatStream">
            <div class="message bot">
              <div class="avatar"><img src="/static/images/chatbot_label.png" alt="himate" /></div>
              <div class="bubble bot-bubble">
                <div class="markdown-answer">안녕하세요. 한국사 개념이나 한능검 문제를 질문해 주세요.</div>
              </div>
            </div>
          </div>

          <form class="composer" id="chatForm">
            {% csrf_token %}
            <div class="composer-box">
              <button class="problem-picker-trigger" id="problemPickerButton" type="button">문제 선택</button>
              <textarea class="question-input" id="questionInput" rows="1" placeholder=" 한국사 개념, 문제 질문, 학습 대화를 입력해 주세요."></textarea>
              <button class="send" id="sendButton" type="submit">↑</button>
            </div>
          </form>
        </section>

      </div>
    </section>

  </main>

  <div class="problem-picker-modal" id="problemPickerModal" hidden>
    <button class="problem-picker-backdrop" id="problemPickerBackdrop" type="button" aria-label="문제 선택 닫기"></button>
    <section class="problem-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="problemPickerTitle">
      <header class="problem-picker-head">
        <div>
          <span>solved-problems</span>
          <h2 id="problemPickerTitle">풀었던 문제 선택</h2>
        </div>
        <button class="problem-picker-close" id="problemPickerClose" type="button" aria-label="닫기">×</button>
      </header>
      <label class="problem-picker-search">
        <span>문제 검색</span>
        <input id="problemPickerSearch" type="search" placeholder="시대, 주제, 문제 내용 검색" />
      </label>
      <div class="problem-picker-status" id="problemPickerStatus">문제 목록을 불러오는 중입니다.</div>
      <div class="problem-picker-list" id="problemPickerList" aria-label="풀었던 문제 목록"></div>
    </section>
  </div>

  <section class="image-preview" id="imagePreview" role="dialog" aria-modal="true" aria-label="이미지 확대" hidden>
    <button class="image-preview-backdrop" id="imagePreviewBackdrop" type="button" aria-label="이미지 확대 닫기"></button>
    <figure class="image-preview-content">
      <button class="image-preview-close" id="imagePreviewClose" type="button" aria-label="닫기">×</button>
      <img id="imagePreviewImage" alt="확대된 선택지 이미지" />
    </figure>
  </section>
  <script>
    const chatStream = document.getElementById("chatStream");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendButton");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const sessionList = document.getElementById("sessionList");
    const chatLayout = document.querySelector(".chat-layout");
    const chatSidebarToggle = document.getElementById("chatSidebarToggle");
    const newSessionButton = document.getElementById("newSessionButton");
    const sessionSearchInput = document.getElementById("sessionSearchInput");
    const problemPickerButton = document.getElementById("problemPickerButton");
    const problemPickerModal = document.getElementById("problemPickerModal");
    const problemPickerBackdrop = document.getElementById("problemPickerBackdrop");
    const problemPickerClose = document.getElementById("problemPickerClose");
    const problemPickerSearch = document.getElementById("problemPickerSearch");
    const problemPickerStatus = document.getElementById("problemPickerStatus");
    const problemPickerList = document.getElementById("problemPickerList");
    const STORAGE_KEY = "himate_chat_sessions";
    let mode = "auto";
    let sessions = loadSessions().filter((session) => Array.isArray(session.messages) && session.messages.length > 0);
    let activeSessionId = sessions[0]?.id || createSession("새 대화").id;
    let solvedProblems = [];
    let solvedProblemsLoaded = false;

    saveSessions();
    renderSessionList();
    renderActiveSession();
    openPendingProblemContext();

    chatSidebarToggle.addEventListener("click", () => {
      const collapsed = chatLayout.classList.toggle("is-sidebar-collapsed");
      chatSidebarToggle.classList.toggle("is-active", !collapsed);
      chatSidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      chatSidebarToggle.setAttribute("aria-label", collapsed ? "대화 목록 펼치기" : "대화 목록 접기");
    });

    newSessionButton.addEventListener("click", () => {
      const session = createSession("새 대화");
      activeSessionId = session.id;
      saveSessions();
      renderSessionList();
      renderActiveSession();
      input.focus();
    });

    sessionSearchInput.addEventListener("input", renderSessionList);
    problemPickerButton.addEventListener("click", openProblemPicker);
    problemPickerBackdrop.addEventListener("click", closeProblemPicker);
    problemPickerClose.addEventListener("click", closeProblemPicker);
    problemPickerSearch.addEventListener("input", renderProblemPickerList);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !problemPickerModal.hidden) {
        closeProblemPicker();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      submitChatQuestion(question);
    });

    async function submitChatQuestion(question, displayQuestion = question, options = {}) {
      const intent = options.intent || classifyChatIntent(displayQuestion);
      const conversationHistory = recentConversationHistory();

      appendUserMessage(displayQuestion);
      addMessageToActiveSession({ sender: "user", text: displayQuestion, context: options.historyContext || displayQuestion });
      input.value = "";
      input.style.height = "auto";

      sendButton.disabled = true;
      const loading = appendLoadingMessage();

      try {
        const answerFormat = intent === "concept" ? "structured" : "text";
        const payload = {
          question,
          display_question: displayQuestion,
          session_id: activeSessionId,
          mode,
          intent,
          answer_format: answerFormat,
          top_k: intent === "question" ? 8 : 20,
          conversation_history: conversationHistory,
          problem_session_id: options.problemSessionId || null,
          problem_record_id: options.problemRecordId || null,
          foundation_explanation: options.foundationExplanation === true,
        };
        if (intent === "concept" || intent === "question") {
          const data = await streamConceptAnswer(payload, loading, intent === "question" ? "문제 해설" : "개념 정리", intent === "question" ? problemTitleFromContext(question) : "", options.problemImagePath || "");
          data.intent = intent;
          addMessageToActiveSession({ sender: "bot", data, intent });
          return;
        }
        const response = await fetch("{% url 'chatbot:rag_chat_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        data.intent = intent;
        loading.remove();

        if (!response.ok) {
          appendErrorMessage(data.error || "답변 생성에 실패했습니다.", data.detail);
          return;
        }

        appendBotMessage(data);
        addMessageToActiveSession({ sender: "bot", data, intent });
      } catch (error) {
        loading.remove();
        const message = error.message || "네트워크 오류가 발생했습니다.";
        appendErrorMessage(message === "RAG 답변 생성 중 오류가 발생했습니다." ? message : "네트워크 오류가 발생했습니다.", message === "RAG 답변 생성 중 오류가 발생했습니다." ? "" : message);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    async function streamConceptAnswer(payload, loading, label = "개념 정리", problemTitle = "", problemImagePath = "") {
      const response = await fetch("{% url 'chatbot:rag_chat_stream_api' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
        body: JSON.stringify(payload),
      });
      if (!response.ok || !response.body) {
        const data = await response.json();
        throw new Error(data.error || "답변 생성에 실패했습니다.");
      }
      loading.remove();
      const view = appendStreamingStructuredMessage(label, problemTitle, problemImagePath);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let result = null;
      const applyFrame = async (frame) => {
        const dataLine = frame.split("\n").find((line) => line.startsWith("data: "));
        if (!dataLine) return;
        const event = JSON.parse(dataLine.slice(6));
        if (event.type === "done") result = event.data;
        else if (event.type === "error") throw new Error(event.error);
        else {
          view.apply(event);
          if (event.type === "section" || event.type === "row") {
            await new Promise((resolve) => setTimeout(resolve, event.type === "section" ? 260 : 180));
          }
        }
      };
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop();
        for (const frame of frames) {
          await applyFrame(frame);
        }
      }
      buffer += decoder.decode();
      if (buffer.trim()) await applyFrame(buffer);
      if (!result) throw new Error("답변 스트리밍이 완료되지 않았습니다.");
      if (result.not_found) {
        view.wrapper.remove();
        appendBotMessage(result);
      } else {
        view.finish(result);
        addFoundationExplanationButton(view.wrapper, result, payload);
      }
      return result;
    }

    function addFoundationExplanationButton(wrapper, data, payload) {
      if (payload.intent !== "question" || data.explanation_level !== "core") return;
      const note = wrapper.querySelector(".problem-note");
      if (!note || note.querySelector(".foundation-explanation-button")) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "foundation-explanation-button";
      button.textContent = "기초 해설 보기";
      button.addEventListener("click", () => {
        button.disabled = true;
        submitChatQuestion(payload.question, "기초 해설 보기", {
          intent: "question",
          problemSessionId: payload.problem_session_id || data.problem_session_id || null,
          problemRecordId: payload.problem_record_id || null,
          foundationExplanation: true,
          historyContext: payload.question,
        });
      });
      (note.querySelector(".sources") || note).before(button);
    }

    function appendStreamingStructuredMessage(label = "개념 정리", problemTitle = "", problemImagePath = "") {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      wrapper.innerHTML = `
        <div class="avatar"><img src="/static/images/chatbot_label.png" alt="himate" /></div>
        <div class="bubble bot-bubble"><div class="bot-label"><span class="bot-dot"></span><span>${escapeHtml(label)}</span></div><article class="note ${label === "문제 해설" ? "problem-note" : ""}">${problemTitle ? `<p class="selected-problem-title">선택 문제 · ${escapeHtml(problemTitle)}</p>` : ""}${problemImagePath ? `<div class="selected-problem-image-wrap"><img class="selected-problem-image" src="${escapeHtml(assetUrl(problemImagePath))}" alt="선택 문항 자료 이미지"><button type="button" class="selected-problem-question-zoom" data-image="${escapeHtml(assetUrl(problemImagePath))}" data-alt="선택 문항 자료 이미지" aria-label="문항 자료 이미지 확대"><img src="/static/images/zoom-in.png" alt=""></button></div>` : ""}<h1 class="title"></h1><p class="summary"></p><div class="stream-sections"></div></article></div>`;
      chatStream.appendChild(wrapper);
      wrapper.querySelectorAll(".selected-problem-question-zoom").forEach((button) => {
        button.addEventListener("click", () => openImagePreview(button.dataset.image, button.dataset.alt));
      });
      const note = wrapper.querySelector(".note");
      const sections = wrapper.querySelector(".stream-sections");
      let table = null;
      return {
        wrapper,
        apply(event) {
          if (event.type === "meta") {
            note.querySelector(".title").textContent = event.title || "한국사 개념 정리";
            note.querySelector(".summary").textContent = event.summary || "";
          }
          if (event.type === "section") {
            const match = String(event.heading || "").match(/^(\d+)\.\s*(.*)$/);
            const number = match ? match[1] : String(sections.children.length + 1);
            const heading = match ? match[2] : event.heading;
            const section = document.createElement("section");
            section.className = "section";
            const title = `<span class="section-number">${escapeHtml(number)}</span><span>${escapeHtml(heading)}</span>`;
            section.innerHTML = String(heading).includes("선지별 해설")
              ? `<details class="foundation-details"><summary>${title}</summary><table><tbody></tbody></table></details>`
              : `<h2 class="section-title">${title}</h2><table><tbody></tbody></table>`;
            sections.appendChild(section);
            table = section.querySelector("tbody");
          }
          if (event.type === "row" && table) {
            const row = document.createElement("tr");
            row.innerHTML = `<th>${escapeHtml(event.term)}</th><td>${escapeHtml(event.content)}</td>`;
            table.appendChild(row);
          }
          scrollToBottom();
        },
        finish(data) {
          const sourceTitles = data.structured_answer?.source_titles?.length ? data.structured_answer.source_titles : (data.sources || []).slice(0, 3).map((source) => source.title);
          note.insertAdjacentHTML("beforeend", `<section class="sources"><h2>출처</h2><ul>${sourceTitles.map((title) => `<li>${escapeHtml(title)}</li>`).join("")}</ul></section>`);
          scrollToBottom();
        },
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "message user";
      wrapper.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function classifyChatIntent(question) {
      const text = String(question || "").trim().toLowerCase();
      const compact = text.replace(/\s+/g, "");
      if (/^(안녕|안녕하세요|ㅎㅇ|하이|hi|hello|헬로|고마워|감사|ㄱㅅ)$/.test(compact)) {
        return "casual";
      }
      if (/(사진|이미지|그림|도판|자료사진|유물사진|문화재사진|보여줘|보여줄래|찾아줘|가져와|띄워줘)/.test(text)
          && /(사진|이미지|그림|도판|보여|찾아|가져|띄워)/.test(text)) {
        return "image";
      }
      if (/(문제|선지|보기|정답|오답|해설|풀이|몇\s*번|왜\s*틀|왜\s*맞|기출|문항)/.test(text)) {
        return "question";
      }
      if (/(날씨|기온|비\s*와|비와|눈\s*와|눈와|미세먼지|내일|오늘|시간|날짜|요일|잡담|농담|힘들|공부법|계획|동기부여|뭐해|도와줘)/.test(text)
          && !/(한국사|조선|고려|신라|백제|고구려|발해|근대|현대|왕|전쟁|제도|사건|인물)/.test(text)) {
        return "chat";
      }
      return "concept";
    }

    function recentConversationHistory() {
      const session = getActiveSession();
      return (session.messages || [])
        .slice(-10)
        .map((message) => {
          if (message.sender === "user") {
            return { role: "user", content: message.context || message.text || "" };
          }
          const data = message.data || {};
          const structured = data.structured_answer || {};
          const botText = data.context
            || data.answer
            || structured.summary
            || structured.title
            || "";
          return { role: "assistant", content: botText };
        })
        .filter((item) => item.content);
    }

    async function openProblemPicker() {
      problemPickerModal.hidden = false;
      problemPickerSearch.value = "";
      problemPickerSearch.focus();
      if (!solvedProblemsLoaded) {
        await loadSolvedProblems();
      } else {
        renderProblemPickerList();
      }
    }

    function closeProblemPicker() {
      problemPickerModal.hidden = true;
      input.focus();
    }

    async function loadSolvedProblems() {
      problemPickerStatus.textContent = "문제 목록을 불러오는 중입니다.";
      problemPickerList.innerHTML = "";
      try {
        const response = await fetch("{% url 'chatbot:solved_problem_options_api' %}", {
          headers: { "X-CSRFToken": csrfToken },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "문제 목록을 불러오지 못했습니다.");
        }
        solvedProblems = Array.isArray(data.problems) ? data.problems : [];
        solvedProblemsLoaded = true;
        renderProblemPickerList();
      } catch (error) {
        problemPickerStatus.textContent = error.message;
      }
    }

    function renderProblemPickerList() {
      const keyword = problemPickerSearch.value.trim().toLowerCase();
      const filtered = keyword
        ? solvedProblems.filter((problem) => {
            const text = [
              problem.content,
              problem.era,
              problem.topic,
              problem.question_type,
              problem.core_concept,
              problem.options?.map((option) => option.content).join(" "),
            ].join(" ").toLowerCase();
            return text.includes(keyword);
          })
        : solvedProblems;

      if (!solvedProblems.length) {
        problemPickerStatus.textContent = "아직 풀었던 문제가 없습니다.";
        problemPickerList.innerHTML = "";
        return;
      }

      problemPickerStatus.textContent = `${filtered.length}개 문제`;
      problemPickerList.innerHTML = filtered.map((problem) => `
        <article class="problem-picker-item">
          <button type="button" data-record-id="${escapeHtml(problem.record_id)}">
            <span class="problem-picker-meta">
              ${escapeHtml(problem.session_label || "풀이 기록")} · ${escapeHtml(problem.number)}번 · ${escapeHtml(problem.era || "-")} · ${escapeHtml(problem.topic || "-")}
            </span>
            <strong>${escapeHtml(problem.content || "문제 내용 없음")}</strong>
            <span class="problem-picker-result ${problem.is_correct ? "correct" : "wrong"}">
              ${problem.is_correct ? "정답" : "오답"} · 내 답 ${escapeHtml(answerLabel(problem.selected_no))} · 정답 ${escapeHtml(answerLabel(problem.answer_no))}
            </span>
          </button>
        </article>
      `).join("") || `<p class="problem-picker-empty">검색 결과가 없습니다.</p>`;

      problemPickerList.querySelectorAll("button[data-record-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const problem = solvedProblems.find((item) => String(item.record_id) === String(button.dataset.recordId));
          if (problem) selectProblemForChat(problem);
        });
      });
    }

    function answerLabel(value) {
      return value ? `${value}번` : "미응답";
    }

    function assetUrl(path) {
      if (!path) return "";
      if (/^(https?:)?\/\//.test(path)) return proxiedImageUrl(path);
      if (path.startsWith("/")) return path;
      return `/${path}`;
    }

    function selectProblemForChat(problem) {
      closeProblemPicker();
      appendProblemActionMessage(problem);
      addMessageToActiveSession({ sender: "problem", problem });
    }

    function openPendingProblemContext() {
      const raw = sessionStorage.getItem("chatbotProblemContext");
      if (!raw) return;
      sessionStorage.removeItem("chatbotProblemContext");
      try {
        selectProblemForChat(JSON.parse(raw));
      } catch (error) {
        appendErrorMessage("문제 정보를 불러오지 못했습니다.", error.message);
      }
    }

    function buildProblemContext(problem, prompt) {
      const options = (problem.options || [])
        .map((option) => `${option.choice_no}. ${option.content}`)
        .join("\n");
      return [
        prompt,
        "",
        problem.passage ? `[지문]\n${problem.passage}` : "",
        problem.image_caption ? `[자료 설명]\n${problem.image_caption}` : "",
        `[문제] ${problem.content || ""}`,
        options ? `[보기]\n${options}` : "",
        `[내 답] ${answerLabel(problem.selected_no)}`,
        `[정답] ${answerLabel(problem.answer_no)}`,
        `[분류] ${problem.era || "-"} / ${problem.topic || "-"} / ${problem.question_type || "-"}`,

    function appendBotMessage(data, stream = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      const intent = data.intent || "concept";
      if (data.not_found || isInsufficientStructuredAnswer(data.structured_answer)) {
        wrapper.innerHTML = `
          <div class="avatar"><img src="/static/images/chatbot_label.png" alt="himate" /></div>
          <div class="bubble bot-bubble no-result-bubble">

          </div>
        `;
        chatStream.appendChild(wrapper);
        if (stream) streamBotBubble(wrapper);
        else scrollToBottom();
        return;
      }
      const shouldShowImages = intent === "image";
      const shouldShowStructured = (intent === "concept" || intent === "question") && data.structured_answer;
      const imageGallery = shouldShowImages ? renderImageGallery(data.sources || [], data.structured_answer) : "";
      const answerText = intent === "question"
        ? stripSourceSummary(data.answer || data.structured_answer?.summary || "답변을 생성하지 못했습니다.")
        : data.answer || data.structured_answer?.summary || "답변을 생성하지 못했습니다.";
      const content = shouldShowImages
        ? renderConversationalAnswer(stripImageUrls(cleanImageAnswerTitle(answerText)))
        : shouldShowStructured
        ? renderStructuredAnswer(data.structured_answer, data.sources || [])
        : data.explanation_level === "foundation" ? renderFoundationAnswer(answerText) : renderConversationalAnswer(answerText);
      const body = shouldShowImages
        ? `<div class="image-answer-layout">${content}${imageGallery}</div>`
        : `${imageGallery}${content}`;
      const label = intent === "concept" ? "개념 정리"
        : intent === "image" ? "이미지 자료"
        : intent === "question" ? "문제 해설"

      });

      else scrollToBottom();
    }

    function streamBotBubble(wrapper) {
      const bubble = wrapper.querySelector(".bot-bubble");
      if (!bubble) return scrollToBottom();
      const finalHtml = bubble.innerHTML;
      const blocks = [...bubble.querySelectorAll(`
        .note > .title,
        .note > .summary,
        .section-title,
        .section tr,
        .sources,
        .conversational-answer > *,
        .image-gallery .image-card
      `)].filter((element) => !element.closest(".bot-label"));
      if (!blocks.length) return scrollToBottom();

      const rowTexts = new Map();
      blocks.forEach((element) => {
        element.dataset.streamDisplay = element.style.display || "";
        if (element.matches(".section tr")) {
          rowTexts.set(element, [...element.cells].map((cell) => cell.textContent));
          [...element.cells].forEach((cell) => { cell.textContent = ""; });
        }
        element.style.display = "none";
      });
      let index = 0;
      const showNext = () => {
        const element = blocks[index];
        if (!element) {
          bubble.innerHTML = finalHtml;
          scrollToBottom();
          return;
        }
        element.style.display = element.dataset.streamDisplay;
        if (element.matches(".section tr")) {
          typeTableRow(element, rowTexts.get(element) || [], () => {
            index += 1;
            scrollToBottom();
            setTimeout(showNext, 60);
          });
          return;
        }
        index += 1;
        scrollToBottom();
        setTimeout(showNext, element.matches(".section-title") ? 220 : 90);
      };
      showNext();
    }

    function typeTableRow(row, texts, done) {
      const cells = [...row.cells];
      let cellIndex = 0;
      let charIndex = 0;

      const step = () => {
        const cell = cells[cellIndex];
        if (!cell) return done();

        const text = texts[cellIndex] || "";
        cell.textContent = text.slice(0, charIndex + 1);
        charIndex += 1;

        if (charIndex <= text.length) {
          setTimeout(step, 35);
          return;
        }

        cellIndex += 1;
        charIndex = 0;
        setTimeout(step, 20);
      };

      step();
    }

    function renderBotLabel(label) {
      return label === "himate"
        ? ""
        : `<div class="bot-label"><span class="bot-dot"></span><span>${escapeHtml(label)}</span></div>`;
    }

    function stripSourceSummary(answer) {
      return String(answer || "").split(/\n\s*#{1,3}\s*출처|(?:\n|^)출처\s*요약|(?:\n|^)출처\s*$/)[0].trim();
    }

    function loadSessions() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.slice(0, 30)));
    }

    function createSession(title) {
      const session = {
        id: `session-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        updatedAt: new Date().toISOString(),
        messages: [],
      };
      sessions.unshift(session);
      return session;
    }

    function getActiveSession() {
      let session = sessions.find((item) => item.id === activeSessionId);
      if (!session) {
        session = createSession("새 대화");
        activeSessionId = session.id;
        saveSessions();
      }
      return session;
    }

    function addMessageToActiveSession(message) {
      const session = getActiveSession();
      session.messages.push({ ...message, createdAt: new Date().toISOString() });
      session.messages = session.messages.slice(-10);
      const firstUserMessage = session.messages.find((item) => item.sender === "user");
      if (firstUserMessage) {
        session.title = firstUserMessage.text.slice(0, 24) || "새 대화";
      }
      session.updatedAt = new Date().toISOString();
      sessions = [session, ...sessions.filter((item) => item.id !== session.id)];
      activeSessionId = session.id;
      saveSessions();
      renderSessionList();
    }

    function renderSessionList() {
      const keyword = (sessionSearchInput?.value || "").trim().toLowerCase();
      const visibleSessions = keyword
        ? sessions.filter((session) => String(session.title || "").toLowerCase().includes(keyword))
        : sessions;

      sessionList.innerHTML = visibleSessions.map((session) => `
        <button class="session-item ${session.id === activeSessionId ? "active" : ""}" type="button" data-session-id="${escapeHtml(session.id)}">
          <span class="session-copy">
            <strong>${escapeHtml(session.title || "새 대화")}</strong>
            <span>${session.messages.length}개 메시지</span>
          </span>
          <span class="session-delete" role="button" tabindex="0" aria-label="대화 삭제" data-session-id="${escapeHtml(session.id)}">삭제</span>
        </button>
      `).join("") || `<p class="empty-session">저장된 대화가 없습니다.</p>`;

      sessionList.querySelectorAll(".session-item").forEach((button) => {
        button.addEventListener("click", () => {
          activeSessionId = button.dataset.sessionId;
          renderSessionList();
          renderActiveSession();
        });
      });

      sessionList.querySelectorAll(".session-delete").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteSession(button.dataset.sessionId);
        });
        button.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          event.stopPropagation();
          deleteSession(button.dataset.sessionId);
        });
      });
    }

    function deleteSession(sessionId) {
      sessions = sessions.filter((session) => session.id !== sessionId);
      if (!sessions.length) {
        const session = createSession("새 대화");
        activeSessionId = session.id;
      } else if (activeSessionId === sessionId) {
        activeSessionId = sessions[0].id;
      }
      saveSessions();
      renderSessionList();
      renderActiveSession();
    }

    function renderActiveSession() {
      chatStream.innerHTML = "";
      const session = getActiveSession();
      if (!session.messages.length) {
        appendWelcomeMessage();
        scrollToBottom();
        return;
      }
      session.messages.forEach((message) => {
        if (message.sender === "user") appendUserMessage(message.text);
        if (message.sender === "bot") appendBotMessage({ ...message.data, intent: message.intent || message.data?.intent });
        if (message.sender === "problem" && message.problem) appendProblemActionMessage(message.problem);
      });
      scrollToBottom();
    }

    function isInsufficientStructuredAnswer(answer) {
      if (!answer) return false;
      const itemCount = (answer.sections || []).reduce((count, section) => {
        return count + (section.items || []).filter((item) => item?.term || item?.content).length;
      }, 0);
      if (itemCount >= 2) return false;
      const terms = [
        "확인 불가",
        "근거 부족",
        "답변 불가",
        "답변할 수 없",
        "찾을 수 없",
        "부족합니다",
        "부족하여",
        "충분히 제시되어 있지",
        "단정하기 어렵",
        "확정하기 어렵",
        "구체적으로 나오지 않",
        "직접 제시되어 있지",
      ];
      const sectionText = (answer.sections || []).map((section) => {
        const itemText = (section.items || []).map((item) => `${item.term || ""} ${item.content || ""}`).join(" ");
        return `${section.heading || ""} ${itemText}`;
      }).join(" ");
      const text = `${answer.title || ""} ${answer.summary || ""} ${(answer.exam_points || []).join(" ")} ${sectionText}`;
      return terms.some((term) => text.includes(term));
    }

    function renderConversationalAnswer(answer) {
      const lines = String(answer || "").split(/\r?\n/);
      const html = [];
      let list = [];

      const flushList = () => {
        if (!list.length) return;
        html.push(`<ul>${list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`);
        list = [];
      };

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i].trim();
        if (!line) {
          flushList();
          continue;
        }
        if (/^\|.+\|$/.test(line) && /^\|[\s:-]+\|/.test(lines[i + 1]?.trim() || "")) {
          flushList();
          const headers = line.split("|").slice(1, -1).map((cell) => cell.trim());
          const rows = [];
          i += 2;
          while (/^\|.+\|$/.test(lines[i]?.trim() || "")) {
            rows.push(lines[i].trim().split("|").slice(1, -1).map((cell) => cell.trim()));
            i += 1;
          }
          i -= 1;
          html.push(`
            <table class="simple-markdown-table">
              <thead><tr>${headers.map((cell) => `<th>${escapeHtml(cell)}</th>`).join("")}</tr></thead>
              <tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
            </table>
          `);
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushList();
          const level = Math.min(heading[1].length + 1, 4);
          html.push(`<h${level}>${escapeHtml(heading[2])}</h${level}>`);
          continue;
        }
        const bullet = line.match(/^[-*]\s+(.+)$/);
        if (bullet) {
          list.push(bullet[1]);
          continue;
        }
        flushList();
        html.push(`<p>${escapeHtml(line)}</p>`);
      }
      flushList();
      return `<div class="markdown-answer conversational-answer">${html.join("")}</div>`;
    }

    function problemTitleFromContext(question) {
      const match = String(question || "").match(/\[문제\]\s*([\s\S]*?)(?=\n\[[^\]]+\]|$)/);
      return match ? match[1].trim() : "";
    }

    function renderFoundationAnswer(answer) {
      const lines = String(answer || "").split(/\r?\n/);
      const detailIndex = lines.findIndex((line) => line.includes("선지별 해설"));
      if (detailIndex < 0) return renderConversationalAnswer(answer);
      return `${renderConversationalAnswer(lines.slice(0, detailIndex).join("\n"))}<details class="foundation-details"><summary>선지별 상세 해설 보기</summary>${renderConversationalAnswer(lines.slice(detailIndex + 1).join("\n"))}</details>`;
    }

    function cleanImageAnswerTitle(answer) {
      return String(answer || "").replace(/^(#{1,3}\s+.+?)(?:\s*(?:사진|이미지|그림))\s*$/m, "$1");
    }

    function stripImageUrls(answer) {
      return String(answer || "")
        .split(/\r?\n/)
        .filter((line) => !/이미지\s*주소|image\s*url|https?:\/\/\S+/i.test(line))
        .join("\n");
    }

    function renderStructuredAnswer(answer, sources) {
      const sections = (answer.sections || []).map((section, index) => {
        const numberMatch = String(section.heading || "").match(/^(\d+)\.\s*(.*)$/);
        const number = numberMatch ? numberMatch[1] : String(index + 1);
        const heading = numberMatch ? numberMatch[2] : section.heading;
        const rows = (section.items || [])
          .filter((item) => !isImageItem(item))
          .map((item) => `
          <tr>
            <th>${escapeHtml(item.term)}</th>
            <td>${escapeHtml(item.content)}</td>
          </tr>
        `).join("");
        if (!rows) return "";

        const title = `<span class="section-number">${escapeHtml(number)}</span><span>${escapeHtml(heading)}</span>`;
        return String(heading).includes("선지별 해설")
          ? `<section class="section"><details class="foundation-details"><summary>${title}</summary><table><tbody>${rows}</tbody></table></details></section>`
          : `<section class="section"><h2 class="section-title">${title}</h2><table><tbody>${rows}</tbody></table></section>`;
      }).join("");

      const sourceTitles = answer.source_titles || [];
      const sourceItems = sourceTitles.length
        ? sourceTitles.map((title) => `<li>${escapeHtml(title)}</li>`).join("")
        : sources.slice(0, 3).map((source) => `<li>${escapeHtml(source.title)}</li>`).join("");
      return `
        <article class="note ${answer.answer_type === "follow_up_explanation" ? "problem-note" : ""}">
          <h1 class="title">${escapeHtml(answer.title)}</h1>
          <p class="summary">${escapeHtml(answer.summary)}</p>
          ${sections}
          <section class="sources">
            <h2>출처</h2>
            <ul>${sourceItems}</ul>
          </section>
        </article>
      `;
    }

    function isImageUrl(value) {
      return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(String(value || "").trim());
    }

    function proxiedImageUrl(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url);
        if (parsed.hostname === "contents.history.go.kr") {
          return `{% url 'chatbot:image_proxy' %}?url=${encodeURIComponent(url)}`;
        }
      } catch (error) {
        return url;
      }
      return url;
    }

    function isImageItem(item) {
      const term = String(item?.term || "");
      const content = String(item?.content || "");
      return isImageUrl(content) || (term.includes("사진") && content.startsWith("http"));
    }

    function structuredImageSources(answer) {
      const result = [];
      for (const section of answer?.sections || []) {
        for (const item of section.items || []) {
          if (!isImageItem(item)) continue;
          result.push({
            title: item.term || answer.title || "이미지 자료",
            source_name: "한국사 이미지 자료",
            original_image_url: item.content,
            source_url: item.content,
          });
        }
      }
      return result;
    }

    function renderImageGallery(sources, structuredAnswer) {
      const mergedSources = [
        ...sources,
        ...structuredImageSources(structuredAnswer),
      ];
      const seen = new Set();
      const imageSources = mergedSources
        .filter((source) => source.original_image_url || source.thumbnail_url)
        .filter((source) => {
          const url = source.original_image_url || source.thumbnail_url;
          if (seen.has(url)) return false;
          seen.add(url);
          return true;
        })
        .slice(0, 4);
      if (!imageSources.length) return "";

      return `
        <section class="image-gallery" aria-label="이미지 자료">
          ${imageSources.map((source) => {
            const imageUrl = source.thumbnail_url || source.original_image_url;
            const proxiedUrl = proxiedImageUrl(imageUrl);
            const sourceUrl = source.source_url || source.original_image_url || imageUrl;
            const imageSource = source.metadata?.image?.source || source.source_name || "한국사 이미지 자료";
            const imageTitle = String(source.title || "이미지 자료").replace(/\s*사진\s*$/u, "");
            return `
              <article class="image-card">
                <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">
                  <img
                    src="${escapeHtml(proxiedUrl)}"
                    data-original-src="${escapeHtml(imageUrl)}"
                    alt="${escapeHtml(imageTitle)}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="handleImageError(this)"
                  />
                </a>
                <div class="image-fallback" hidden>
                  <strong>이미지를 바로 불러오지 못했습니다.</strong>
                  <span>카드를 클릭해 원본 자료를 확인해 주세요.</span>
                </div>
                <div class="image-meta">
                  <strong>${escapeHtml(imageTitle)}</strong>
                  <span>${escapeHtml(imageSource)}</span>
                </div>
              </article>
            `;
          }).join("")}
        </section>
      `;
    }

    function handleImageError(image) {
      if (!image.dataset.directTried && image.dataset.originalSrc && image.src !== image.dataset.originalSrc) {
        image.dataset.directTried = "1";
        image.src = image.dataset.originalSrc;
        return;
      }

      const card = image.closest(".image-card");
      const fallback = card?.querySelector(".image-fallback");
      image.hidden = true;
      if (fallback) fallback.hidden = false;
    }

    function scrollToBottom() {
      chatStream.scrollTop = chatStream.scrollHeight;
    }
    function openImagePreview(src, alt) {
      document.getElementById("imagePreviewImage").src = src;
      document.getElementById("imagePreviewImage").alt = alt;
      document.getElementById("imagePreview").hidden = false;
    }

    function closeImagePreview() {
      document.getElementById("imagePreview").hidden = true;
      document.getElementById("imagePreviewImage").removeAttribute("src");
    }

    document.getElementById("imagePreviewBackdrop").addEventListener("click", closeImagePreview);
    document.getElementById("imagePreviewClose").addEventListener("click", closeImagePreview);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeImagePreview();
    });
  </script>
</body>
</html>
