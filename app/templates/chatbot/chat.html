{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate 한국사 챗봇</title>
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
  <link rel="stylesheet" href="{% static 'chatbot/css/chat.css' %}?v=chat-new-session-1" />
</head>
<body>
  <main class="chat-page">
    <header class="chat-header" aria-label="챗봇 메뉴">
      <a class="brand" href="/" aria-label="himate 홈">himate</a>
      <nav class="main-nav" aria-label="학습 메뉴">
        <a href="/diagnosis/">진단 평가</a>
        <a href="/question/">문제 풀이</a>
        <a class="active" href="/chatbot/">챗봇</a>
        <a href="/user/mypage/">나의 학습실</a>
      </nav>
      <nav class="header-actions" aria-label="계정 메뉴">
        <a class="pill-button" href="/user/mypage/">나의 학습실</a>
      </nav>
    </header>

    <section class="messages">
      <div class="chat-layout">
        <aside class="left-sidebar session-sidebar" aria-label="저장된 대화 세션">
          <button class="new-session-button" id="newSessionButton" type="button">+ 새 채팅</button>
          <label class="session-search">
            <span>채팅 검색</span>
            <input id="sessionSearchInput" type="search" placeholder="대화 검색" />
          </label>

          <div class="session-top">
            <h2 class="side-title">최근 대화</h2>
          </div>
          <div class="session-list" id="sessionList" aria-label="저장된 세션 목록"></div>
        </aside>

        <section class="chat-panel" aria-label="챗봇 대화">
          <div class="chat-stream" id="chatStream">
            <div class="message bot">
              <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
              <div class="bubble bot-bubble">
                <div class="bot-label"><span class="bot-dot"></span><span>himate</span></div>
                <div class="markdown-answer">안녕하세요. 한국사 개념이나 한능검 문제를 질문해 주세요.</div>
              </div>
            </div>
          </div>

          <form class="composer" id="chatForm">
            {% csrf_token %}
            <div class="composer-box">
              <button class="problem-picker-trigger" id="problemPickerButton" type="button">문제 선택</button>
              <textarea class="question-input" id="questionInput" rows="1" placeholder="한국사 개념, 문제 질문, 학습 대화를 입력해 주세요."></textarea>
              <button class="send" id="sendButton" type="submit">↑</button>
            </div>
          </form>
        </section>

      </div>
    </section>

  </main>

  <div class="problem-picker-modal" id="problemPickerModal" hidden>
    <button class="problem-picker-backdrop" id="problemPickerBackdrop" type="button" aria-label="문제 선택 닫기"></button>
    <section class="problem-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="problemPickerTitle">
      <header class="problem-picker-head">
        <div>
          <span>solved-problems</span>
          <h2 id="problemPickerTitle">풀었던 문제 선택</h2>
        </div>
        <button class="problem-picker-close" id="problemPickerClose" type="button" aria-label="닫기">×</button>
      </header>
      <label class="problem-picker-search">
        <span>문제 검색</span>
        <input id="problemPickerSearch" type="search" placeholder="시대, 주제, 문제 내용 검색" />
      </label>
      <div class="problem-picker-status" id="problemPickerStatus">문제 목록을 불러오는 중입니다.</div>
      <div class="problem-picker-list" id="problemPickerList" aria-label="풀었던 문제 목록"></div>
    </section>
  </div>

  <script>
    const chatStream = document.getElementById("chatStream");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendButton");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const sessionList = document.getElementById("sessionList");
    const newSessionButton = document.getElementById("newSessionButton");
    const sessionSearchInput = document.getElementById("sessionSearchInput");
    const problemPickerButton = document.getElementById("problemPickerButton");
    const problemPickerModal = document.getElementById("problemPickerModal");
    const problemPickerBackdrop = document.getElementById("problemPickerBackdrop");
    const problemPickerClose = document.getElementById("problemPickerClose");
    const problemPickerSearch = document.getElementById("problemPickerSearch");
    const problemPickerStatus = document.getElementById("problemPickerStatus");
    const problemPickerList = document.getElementById("problemPickerList");
    const STORAGE_KEY = "himate_chat_sessions";
    let mode = "auto";
    let sessions = loadSessions().filter((session) => Array.isArray(session.messages) && session.messages.length > 0);
    let activeSessionId = createSession("새 대화").id;
    let solvedProblems = [];
    let solvedProblemsLoaded = false;

    saveSessions();
    renderSessionList();
    renderActiveSession();

    newSessionButton.addEventListener("click", () => {
      const session = createSession("새 대화");
      activeSessionId = session.id;
      saveSessions();
      renderSessionList();
      renderActiveSession();
      input.focus();
    });

    sessionSearchInput.addEventListener("input", renderSessionList);
    problemPickerButton.addEventListener("click", openProblemPicker);
    problemPickerBackdrop.addEventListener("click", closeProblemPicker);
    problemPickerClose.addEventListener("click", closeProblemPicker);
    problemPickerSearch.addEventListener("input", renderProblemPickerList);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !problemPickerModal.hidden) {
        closeProblemPicker();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      const intent = classifyChatIntent(question);

      appendUserMessage(question);
      addMessageToActiveSession({ sender: "user", text: question });
      input.value = "";
      input.style.height = "auto";

      if (intent === "casual" || intent === "chat") {
        const localAnswer = buildLocalChatAnswer(question);
        const localData = { answer: localAnswer, intent, sources: [] };
        appendBotMessage(localData);
        addMessageToActiveSession({ sender: "bot", data: localData, intent });
        input.focus();
        return;
      }

      sendButton.disabled = true;
      const loading = appendLoadingMessage();

      try {
        const answerFormat = intent === "concept" ? "structured" : "text";
        const response = await fetch("{% url 'chatbot:rag_chat_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify({
            question,
            mode,
            intent,
            answer_format: answerFormat,
            top_k: 5,
          }),
        });
        const data = await response.json();
        data.intent = intent;
        loading.remove();

        if (!response.ok) {
          appendErrorMessage(data.error || "답변 생성에 실패했습니다.", data.detail);
          return;
        }

        appendBotMessage(data);
        addMessageToActiveSession({ sender: "bot", data, intent });
      } catch (error) {
        loading.remove();
        appendErrorMessage("네트워크 오류가 발생했습니다.", error.message);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "message user";
      wrapper.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function classifyChatIntent(question) {
      const text = String(question || "").trim().toLowerCase();
      const compact = text.replace(/\s+/g, "");
      if (/^(안녕|안녕하세요|ㅎㅇ|하이|hi|hello|헬로|고마워|감사|ㄱㅅ)$/.test(compact)) {
        return "casual";
      }
      if (/(사진|이미지|그림|도판|자료사진|유물사진|문화재사진|보여줘|보여줄래|찾아줘|가져와|띄워줘)/.test(text)
          && /(사진|이미지|그림|도판|보여|찾아|가져|띄워)/.test(text)) {
        return "image";
      }
      if (/(문제|선지|보기|정답|오답|해설|풀이|몇\s*번|왜\s*틀|왜\s*맞|기출|문항)/.test(text)) {
        return "question";
      }
      if (/(날씨|기온|비\s*와|비와|눈\s*와|눈와|미세먼지|내일|오늘|시간|날짜|요일|잡담|농담|힘들|공부법|계획|동기부여|뭐해|도와줘)/.test(text)
          && !/(한국사|조선|고려|신라|백제|고구려|발해|근대|현대|왕|전쟁|제도|사건|인물)/.test(text)) {
        return "chat";
      }
      return "concept";
    }

    function buildLocalChatAnswer(question) {
      const text = String(question || "");
      if (/고마워|감사|ㄱㅅ/.test(text)) {
        return "천만에요. 필요하시면 한국사 개념 정리나 문제 해설도 바로 도와드리겠습니다.";
      }
      if (/날씨|기온|비\s*와|비와|눈\s*와|눈와|미세먼지/.test(text)) {
        return "지금 챗봇에는 실시간 날씨 조회 기능은 연결되어 있지 않습니다. 대신 한국사 개념 정리, 문제 해설, 이미지 자료 조회는 바로 도와드릴 수 있습니다.";
      }
      if (/시간|날짜|요일/.test(text)) {
        return "현재 시간이나 날짜 같은 실시간 정보 조회는 아직 챗봇 기능에 연결되어 있지 않습니다. 한국사 학습 질문을 주시면 자료를 바탕으로 답변드리겠습니다.";
      }
      if (/공부법|계획|동기부여|힘들/.test(text)) {
        return "좋습니다. 학습 상담은 대화형으로 도와드릴게요. 현재 목표 급수, 시험일까지 남은 기간, 하루 공부 가능 시간을 알려주시면 한국사 공부 순서를 같이 잡아드리겠습니다.";
      }
      return "안녕하세요. 한국사 개념 정리, 문제 해설, 이미지 자료 조회까지 편하게 물어보세요.";
    }

    async function openProblemPicker() {
      problemPickerModal.hidden = false;
      problemPickerSearch.value = "";
      problemPickerSearch.focus();
      if (!solvedProblemsLoaded) {
        await loadSolvedProblems();
      } else {
        renderProblemPickerList();
      }
    }

    function closeProblemPicker() {
      problemPickerModal.hidden = true;
      input.focus();
    }

    async function loadSolvedProblems() {
      problemPickerStatus.textContent = "문제 목록을 불러오는 중입니다.";
      problemPickerList.innerHTML = "";
      try {
        const response = await fetch("{% url 'chatbot:solved_problem_options_api' %}", {
          headers: { "X-CSRFToken": csrfToken },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "문제 목록을 불러오지 못했습니다.");
        }
        solvedProblems = Array.isArray(data.problems) ? data.problems : [];
        solvedProblemsLoaded = true;
        renderProblemPickerList();
      } catch (error) {
        problemPickerStatus.textContent = error.message;
      }
    }

    function renderProblemPickerList() {
      const keyword = problemPickerSearch.value.trim().toLowerCase();
      const filtered = keyword
        ? solvedProblems.filter((problem) => {
            const text = [
              problem.content,
              problem.era,
              problem.topic,
              problem.question_type,
              problem.core_concept,
              problem.options?.map((option) => option.content).join(" "),
            ].join(" ").toLowerCase();
            return text.includes(keyword);
          })
        : solvedProblems;

      if (!solvedProblems.length) {
        problemPickerStatus.textContent = "아직 풀었던 문제가 없습니다.";
        problemPickerList.innerHTML = "";
        return;
      }

      problemPickerStatus.textContent = `${filtered.length}개 문제`;
      problemPickerList.innerHTML = filtered.map((problem) => `
        <article class="problem-picker-item">
          <button type="button" data-record-id="${escapeHtml(problem.record_id)}">
            <span class="problem-picker-meta">
              Session #${escapeHtml(problem.session_id)} · ${escapeHtml(problem.number)}번 · ${escapeHtml(problem.era || "-")} · ${escapeHtml(problem.topic || "-")}
            </span>
            <strong>${escapeHtml(problem.content || "문제 내용 없음")}</strong>
            <span class="problem-picker-result ${problem.is_correct ? "correct" : "wrong"}">
              ${problem.is_correct ? "정답" : "오답"} · 내 답 ${escapeHtml(answerLabel(problem.selected_no))} · 정답 ${escapeHtml(answerLabel(problem.answer_no))}
            </span>
          </button>
        </article>
      `).join("") || `<p class="problem-picker-empty">검색 결과가 없습니다.</p>`;

      problemPickerList.querySelectorAll("button[data-record-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const problem = solvedProblems.find((item) => String(item.record_id) === String(button.dataset.recordId));
          if (problem) selectProblemForChat(problem);
        });
      });
    }

    function answerLabel(value) {
      return value ? `${value}번` : "미응답";
    }

    function selectProblemForChat(problem) {
      const options = (problem.options || [])
        .map((option) => `${option.choice_no}. ${option.content}`)
        .join("\n");
      const context = [
        "선택한 문제를 바탕으로 설명해줘.",
        "",
        `[문제] ${problem.content || ""}`,
        options ? `[보기]\n${options}` : "",
        `[내 답] ${answerLabel(problem.selected_no)}`,
        `[정답] ${answerLabel(problem.answer_no)}`,
        `[분류] ${problem.era || "-"} / ${problem.topic || "-"} / ${problem.question_type || "-"}`,
      ].filter(Boolean).join("\n");

      input.value = context;
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
      closeProblemPicker();
    }

    function appendWelcomeMessage() {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      wrapper.innerHTML = `
        <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
        <div class="bubble bot-bubble">
          <div class="bot-label"><span class="bot-dot"></span><span>himate</span></div>
          <div class="markdown-answer">한국사 개념 질문, 문제 질문, 가벼운 학습 대화까지 편하게 물어보세요.</div>
        </div>
      `;
      chatStream.appendChild(wrapper);
    }

    function appendLoadingMessage() {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      wrapper.innerHTML = `
        <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
        <div class="bubble bot-bubble typing-bubble" aria-label="답변 생성 중">
          <span></span><span></span><span></span>
        </div>
      `;
      chatStream.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function appendErrorMessage(message, detail) {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      wrapper.innerHTML = `
        <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
        <div class="bubble bot-bubble">
          <div class="bot-label"><span class="bot-dot"></span><span>오류</span></div>
          <div class="error">${escapeHtml(message)}${detail ? `<br>${escapeHtml(detail)}` : ""}</div>
        </div>
      `;
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function appendBotMessage(data) {
      const wrapper = document.createElement("div");
      wrapper.className = "message bot";
      const intent = data.intent || "concept";
      if (data.not_found || isInsufficientStructuredAnswer(data.structured_answer)) {
        wrapper.innerHTML = `
          <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
          <div class="bubble bot-bubble no-result-bubble">
            ${renderConversationalAnswer(data.answer || "검색 결과가 없습니다.")}
          </div>
        `;
        chatStream.appendChild(wrapper);
        scrollToBottom();
        return;
      }
      const shouldShowImages = intent === "image";
      const shouldShowStructured = intent === "concept" && data.structured_answer;
      const imageGallery = shouldShowImages ? renderImageGallery(data.sources || [], data.structured_answer) : "";
      const content = shouldShowStructured
        ? renderStructuredAnswer(data.structured_answer, data.sources || [])
        : renderConversationalAnswer(data.answer || data.structured_answer?.summary || "답변을 생성하지 못했습니다.");
      const label = intent === "concept" ? "개념 정리"
        : intent === "image" ? "이미지 자료"
        : intent === "question" ? "문제 해설"
        : "himate";
      wrapper.innerHTML = `
        <div class="avatar"><img src="{% static 'chatbot/assets/main_image.png' %}" alt="" /></div>
        <div class="bubble bot-bubble">
          <div class="bot-label"><span class="bot-dot"></span><span>${escapeHtml(label)}</span></div>
          ${imageGallery}
          ${content}
        </div>
      `;
      chatStream.appendChild(wrapper);
      scrollToBottom();
    }

    function loadSessions() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.slice(0, 30)));
    }

    function createSession(title) {
      const session = {
        id: `session-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        updatedAt: new Date().toISOString(),
        messages: [],
      };
      sessions.unshift(session);
      return session;
    }

    function getActiveSession() {
      let session = sessions.find((item) => item.id === activeSessionId);
      if (!session) {
        session = createSession("새 대화");
        activeSessionId = session.id;
        saveSessions();
      }
      return session;
    }

    function addMessageToActiveSession(message) {
      const session = getActiveSession();
      session.messages.push({ ...message, createdAt: new Date().toISOString() });
      const firstUserMessage = session.messages.find((item) => item.sender === "user");
      if (firstUserMessage) {
        session.title = firstUserMessage.text.slice(0, 24) || "새 대화";
      }
      session.updatedAt = new Date().toISOString();
      sessions = [session, ...sessions.filter((item) => item.id !== session.id)];
      activeSessionId = session.id;
      saveSessions();
      renderSessionList();
    }

    function renderSessionList() {
      const keyword = (sessionSearchInput?.value || "").trim().toLowerCase();
      const visibleSessions = keyword
        ? sessions.filter((session) => String(session.title || "").toLowerCase().includes(keyword))
        : sessions;

      sessionList.innerHTML = visibleSessions.map((session) => `
        <button class="session-item ${session.id === activeSessionId ? "active" : ""}" type="button" data-session-id="${escapeHtml(session.id)}">
          <span class="session-copy">
            <strong>${escapeHtml(session.title || "새 대화")}</strong>
            <span>${session.messages.length}개 메시지</span>
          </span>
          <span class="session-delete" role="button" tabindex="0" aria-label="대화 삭제" data-session-id="${escapeHtml(session.id)}">삭제</span>
        </button>
      `).join("") || `<p class="empty-session">저장된 대화가 없습니다.</p>`;

      sessionList.querySelectorAll(".session-item").forEach((button) => {
        button.addEventListener("click", () => {
          activeSessionId = button.dataset.sessionId;
          renderSessionList();
          renderActiveSession();
        });
      });

      sessionList.querySelectorAll(".session-delete").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteSession(button.dataset.sessionId);
        });
        button.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          event.stopPropagation();
          deleteSession(button.dataset.sessionId);
        });
      });
    }

    function deleteSession(sessionId) {
      sessions = sessions.filter((session) => session.id !== sessionId);
      if (!sessions.length) {
        const session = createSession("새 대화");
        activeSessionId = session.id;
      } else if (activeSessionId === sessionId) {
        activeSessionId = sessions[0].id;
      }
      saveSessions();
      renderSessionList();
      renderActiveSession();
    }

    function renderActiveSession() {
      chatStream.innerHTML = "";
      const session = getActiveSession();
      if (!session.messages.length) {
        appendWelcomeMessage();
        scrollToBottom();
        return;
      }
      session.messages.forEach((message) => {
        if (message.sender === "user") appendUserMessage(message.text);
        if (message.sender === "bot") appendBotMessage({ ...message.data, intent: message.intent || message.data?.intent });
      });
      scrollToBottom();
    }

    function isInsufficientStructuredAnswer(answer) {
      if (!answer) return false;
      const terms = ["확인 불가", "근거 부족", "답변 불가", "답변할 수 없", "찾을 수 없", "부족합니다", "부족하여"];
      const sectionText = (answer.sections || []).map((section) => {
        const itemText = (section.items || []).map((item) => `${item.term || ""} ${item.content || ""}`).join(" ");
        return `${section.heading || ""} ${itemText}`;
      }).join(" ");
      const text = `${answer.title || ""} ${answer.summary || ""} ${(answer.exam_points || []).join(" ")} ${sectionText}`;
      return terms.some((term) => text.includes(term));
    }

    function renderConversationalAnswer(answer) {
      const html = escapeHtml(answer)
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/\n/g, "<br>");
      return `<div class="markdown-answer conversational-answer"><p>${html}</p></div>`;
    }

    function renderStructuredAnswer(answer, sources) {
      const sections = (answer.sections || []).map((section, index) => {
        const numberMatch = String(section.heading || "").match(/^(\d+)\.\s*(.*)$/);
        const number = numberMatch ? numberMatch[1] : String(index + 1);
        const heading = numberMatch ? numberMatch[2] : section.heading;
        const rows = (section.items || [])
          .filter((item) => !isImageItem(item))
          .map((item) => `
          <tr>
            <th>${escapeHtml(item.term)}</th>
            <td>${escapeHtml(item.content)}</td>
          </tr>
        `).join("");
        if (!rows) return "";

        return `
          <section class="section">
            <h2 class="section-title"><span class="section-number">${escapeHtml(number)}</span><span>${escapeHtml(heading)}</span></h2>
            <table><tbody>${rows}</tbody></table>
          </section>
        `;
      }).join("");

      const sourceTitles = answer.source_titles || [];
      const sourceItems = sourceTitles.length
        ? sourceTitles.map((title) => `<li>${escapeHtml(title)}</li>`).join("")
        : sources.slice(0, 3).map((source) => `<li>${escapeHtml(source.title)}</li>`).join("");
      const examPoints = (answer.exam_points || []).filter((point) => String(point || "").trim());
      const examSection = examPoints.length
        ? `
          <section class="exam">
            <h2>한능검 포인트</h2>
            <ul>${examPoints.map((point) => `<li>${escapeHtml(point)}</li>`).join("")}</ul>
          </section>
        `
        : "";

      return `
        <article class="note">
          <h1 class="title">${escapeHtml(answer.title)}</h1>
          <p class="summary">${escapeHtml(answer.summary)}</p>
          ${sections}
          ${examSection}
          <section class="sources">
            <h2>출처</h2>
            <ul>${sourceItems}</ul>
          </section>
        </article>
      `;
    }

    function isImageUrl(value) {
      return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(String(value || "").trim());
    }

    function proxiedImageUrl(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url);
        if (parsed.hostname === "contents.history.go.kr") {
          return `{% url 'chatbot:image_proxy' %}?url=${encodeURIComponent(url)}`;
        }
      } catch (error) {
        return url;
      }
      return url;
    }

    function isImageItem(item) {
      const term = String(item?.term || "");
      const content = String(item?.content || "");
      return isImageUrl(content) || (term.includes("사진") && content.startsWith("http"));
    }

    function structuredImageSources(answer) {
      const result = [];
      for (const section of answer?.sections || []) {
        for (const item of section.items || []) {
          if (!isImageItem(item)) continue;
          result.push({
            title: item.term || answer.title || "이미지 자료",
            source_name: "한국사 이미지 자료",
            original_image_url: item.content,
            source_url: item.content,
          });
        }
      }
      return result;
    }

    function renderImageGallery(sources, structuredAnswer) {
      const mergedSources = [
        ...sources,
        ...structuredImageSources(structuredAnswer),
      ];
      const seen = new Set();
      const imageSources = mergedSources
        .filter((source) => source.original_image_url || source.thumbnail_url)
        .filter((source) => {
          const url = source.original_image_url || source.thumbnail_url;
          if (seen.has(url)) return false;
          seen.add(url);
          return true;
        })
        .slice(0, 4);
      if (!imageSources.length) return "";

      return `
        <section class="image-gallery" aria-label="이미지 자료">
          ${imageSources.map((source) => {
            const imageUrl = source.thumbnail_url || source.original_image_url;
            const proxiedUrl = proxiedImageUrl(imageUrl);
            const sourceUrl = source.source_url || source.original_image_url || imageUrl;
            return `
              <article class="image-card">
                <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">
                  <img
                    src="${escapeHtml(proxiedUrl)}"
                    data-original-src="${escapeHtml(imageUrl)}"
                    alt="${escapeHtml(source.title || "한국사 이미지 자료")}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="handleImageError(this)"
                  />
                </a>
                <div class="image-fallback" hidden>
                  <strong>이미지를 바로 불러오지 못했습니다.</strong>
                  <span>카드를 클릭해 원본 자료를 확인해 주세요.</span>
                </div>
                <div class="image-meta">
                  <strong>${escapeHtml(source.title || "이미지 자료")}</strong>
                  <span>${escapeHtml(source.source_name || "한국사 이미지 자료")}</span>
                </div>
              </article>
            `;
          }).join("")}
        </section>
      `;
    }

    function handleImageError(image) {
      if (!image.dataset.directTried && image.dataset.originalSrc && image.src !== image.dataset.originalSrc) {
        image.dataset.directTried = "1";
        image.src = image.dataset.originalSrc;
        return;
      }

      const card = image.closest(".image-card");
      const fallback = card?.querySelector(".image-fallback");
      image.hidden = true;
      if (fallback) fallback.hidden = false;
    }

    function scrollToBottom() {
      chatStream.scrollTop = chatStream.scrollHeight;
    }
  </script>
</body>
</html>
