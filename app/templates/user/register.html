<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 회원가입</title>
  <link rel="stylesheet" href="/static/user/css/register.css?v=welcome-character-2" />
  <link rel="stylesheet" href="../../static/user/css/register.css?v=welcome-character-2" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
</head>
<body>
  <header class="site-header" aria-label="회원가입 메뉴">
    <a class="brand" href="/" aria-label="himate 홈">himate</a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a href="/diagnosis/">진단 평가</a>
      <a href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a href="/analytics/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      <a class="pill-button" href="/user/login/">로그인</a>
    </nav>
  </header>
  <main class="auth-page">
    <section class="auth-shell" aria-label="회원가입">
      <aside class="auth-visual" aria-label="환영 메시지">
        <h1><span>HIMATE</span>에 오신 걸 환영합니다</h1>
        <img src="/static/images/register_character.png" alt="" />
      </aside>
      <div class="auth-card">
        <a class="brand" href="/" aria-label="himate 홈">HIMATE</a>

        <div class="auth-heading">
          <h1>회원가입</h1>
          <p>이메일 아이디로 계정을 만들고 맞춤 학습을 시작하세요.</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            {% if message.message != "로그인되었습니다." and message.message != "로그아웃되었습니다." %}
              <p class="auth-message {{ message.tags }}">{{ message }}</p>
            {% endif %}
          {% endfor %}
        {% endif %}

        <form class="register-form" action="#" method="post">
          {% csrf_token %}
          <div class="field">
            <label for="email">이메일 아이디</label>
            <div class="input-action">
              <input id="email" type="email" name="email" autocomplete="email" placeholder="example@email.com" required />
              <button class="action-button" id="sendCodeButton" type="button">인증번호 발송</button>
            </div>
          </div>

          <div class="field verification-field" id="verificationField" hidden>
            <label for="verificationCode">인증번호</label>
            <div class="input-action">
              <input id="verificationCode" type="text" name="verification_code" inputmode="numeric" maxlength="6" placeholder="인증번호를 입력하세요." />
              <button class="action-button" id="verifyCodeButton" type="button">인증번호 확인</button>
            </div>
          </div>
          <p class="verification-message" id="verificationMessage" aria-live="polite"></p>

          <div class="field">
            <label for="nickname">닉네임</label>
            <div class="input-action">
              <input id="nickname" type="text" name="nickname" maxlength="30" autocomplete="nickname" placeholder="닉네임을 입력하세요." required />
              <button class="action-button" id="checkNicknameButton" type="button">중복확인</button>
            </div>
          </div>
          <p class="verification-message" id="nicknameMessage" aria-live="polite"></p>

          <label class="field" for="password">
            <span>비밀번호</span>
            <input id="password" type="password" name="password" autocomplete="new-password" placeholder="비밀번호를 입력하세요." required />
          </label>

          <label class="field" for="passwordConfirm">
            <span>비밀번호 확인</span>
            <input id="passwordConfirm" type="password" name="password_confirm" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요." required />
          </label>

          <div class="agreements" aria-label="약관 동의">
            <label>
              <input type="checkbox" name="terms_age" required />
              <span>이용약관 동의(필수)</span>
              <a href="#">자세히 보기</a>
            </label>
            <label>
              <input type="checkbox" name="terms_privacy" required />
              <span>개인정보 수집 및 이용 동의(필수)</span>
              <a href="#">자세히 보기</a>
            </label>
            <label>
              <input type="checkbox" name="terms_marketing" />
              <span>마케팅 정보 수신 동의(선택)</span>
              <a href="#">자세히 보기</a>
            </label>
          </div>

          <button class="submit-button" type="submit">회원가입 완료</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll("img[data-fallback-src]").forEach((image) => {
      image.addEventListener("error", () => {
        if (image.dataset.fallbackTried) return;
        image.dataset.fallbackTried = "1";
        image.src = image.dataset.fallbackSrc;
      });
    });

    const sendCodeButton = document.getElementById("sendCodeButton");
    const verificationField = document.getElementById("verificationField");
    const verificationCode = document.getElementById("verificationCode");
    const verifyCodeButton = document.getElementById("verifyCodeButton");
    const checkNicknameButton = document.getElementById("checkNicknameButton");

    const emailInput = document.getElementById("email");
    const nicknameInput = document.getElementById("nickname");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const verificationMessage = document.getElementById("verificationMessage");
    const nicknameMessage = document.getElementById("nicknameMessage");
    let isNicknameChecked = false;
    let checkedNickname = "";

    nicknameInput.addEventListener("input", () => {
      isNicknameChecked = false;
      checkedNickname = "";
      nicknameMessage.textContent = "";
      nicknameMessage.className = "verification-message";
    });

    sendCodeButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      if (!email) {
        verificationMessage.textContent = "이메일을 먼저 입력해 주세요.";
        verificationMessage.className = "verification-message error";
        emailInput.focus();
        return;
      }

      sendCodeButton.disabled = true;
      sendCodeButton.textContent = "발송 중";

      try {
        const response = await fetch("/user/send-verification-code/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();
        verificationMessage.textContent = data.message || "인증번호 발송 요청을 처리했습니다.";
        verificationMessage.className = response.ok
          ? "verification-message success"
          : "verification-message error";

        if (response.ok) {
          verificationField.hidden = false;
          sendCodeButton.textContent = "재발송";
          verificationCode.focus();
        } else {
          sendCodeButton.textContent = "인증번호 발송";
        }
      } catch (error) {
        verificationMessage.textContent = "인증번호 발송 중 오류가 발생했습니다.";
        verificationMessage.className = "verification-message error";
        sendCodeButton.textContent = "인증번호 발송";
      } finally {
        sendCodeButton.disabled = false;
      }
    });

    verifyCodeButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const code = verificationCode.value.trim();
      if (!email || !code) {
        verificationMessage.textContent = "이메일과 인증번호를 입력해 주세요.";
        verificationMessage.className = "verification-message error";
        return;
      }

      verifyCodeButton.disabled = true;
      try {
        const response = await fetch("/user/verify-verification-code/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify({ email, code }),
        });
        const data = await response.json();
        verificationMessage.textContent = data.message || "인증번호 확인을 처리했습니다.";
        verificationMessage.className = response.ok
          ? "verification-message success"
          : "verification-message error";
      } catch (error) {
        verificationMessage.textContent = "인증번호 확인 중 오류가 발생했습니다.";
        verificationMessage.className = "verification-message error";
      } finally {
        verifyCodeButton.disabled = false;
      }
    });

    checkNicknameButton.addEventListener("click", async () => {
      const nickname = nicknameInput.value.trim();
      if (!nickname) {
        nicknameMessage.textContent = "닉네임을 입력해 주세요.";
        nicknameMessage.className = "verification-message error";
        nicknameInput.focus();
        return;
      }

      checkNicknameButton.disabled = true;
      checkNicknameButton.textContent = "확인 중";

      try {
        const response = await fetch("/user/check-nickname/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
          },
          body: JSON.stringify({ nickname }),
        });
        const data = await response.json();
        nicknameMessage.textContent = data.message || "닉네임 중복확인을 처리했습니다.";
        nicknameMessage.className = response.ok
          ? "verification-message success"
          : "verification-message error";
        isNicknameChecked = response.ok;
        checkedNickname = response.ok ? nickname : "";
      } catch (error) {
        nicknameMessage.textContent = "닉네임 중복확인 중 오류가 발생했습니다.";
        nicknameMessage.className = "verification-message error";
        isNicknameChecked = false;
        checkedNickname = "";
      } finally {
        checkNicknameButton.disabled = false;
        checkNicknameButton.textContent = "중복확인";
      }
    });

    document.querySelector(".register-form").addEventListener("submit", (event) => {
      const nickname = nicknameInput.value.trim();
      if (!isNicknameChecked || checkedNickname !== nickname) {
        event.preventDefault();
        nicknameMessage.textContent = "닉네임 중복확인을 먼저 해주세요.";
        nicknameMessage.className = "verification-message error";
        nicknameInput.focus();
      }
    });
  </script>
</body>
</html>
