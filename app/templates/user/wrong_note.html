<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 노트</title>
  <link rel="stylesheet" href="/static/user/css/wrong_note.css?v=note-image-choice-3" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
</head>
<body>
  <header class="site-header" aria-label="노트 메뉴">
    <a class="brand" href="/" aria-label="himate 홈">Himate</a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a href="/diagnosis/">진단 평가</a>
      <a href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a class="active" href="/analytics/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      <form class="logout-form" method="post" action="{% url 'user:logout' %}">
        {% csrf_token %}
        <button class="ghost-button" type="submit">로그아웃</button>
      </form>
    </nav>
  </header>

  <main class="wrong-note-page">
    <section class="note-title">

    </section>

    <section class="note-workspace" aria-label="노트 상세">
      <div class="note-toolbar">
        <div class="toolbar-actions">
          <button class="practice-button" id="wrongPracticeButton" type="button">문제 풀이</button>
          <button class="delete-button" id="deleteButton" type="button">저장 해제</button>
        </div>
      </div>

      <div class="note-layout">
        <aside class="note-sidebar" id="noteSidebar" aria-label="노트 및 문항 선택">
          <button class="note-sidebar-toggle is-active" id="noteSidebarToggle" type="button" aria-controls="noteSidebar" aria-expanded="true" aria-label="사이드바 접기"></button>
          <nav class="note-tabs" aria-label="노트 보기">
            <button class="active" type="button" data-note-tab="wrong">오답 노트</button>
            <button type="button" data-note-tab="saved">저장 노트</button>
          </nav>
          <div class="note-list-panel">
            <div class="note-list-heading">
              <h2 id="listTitle">세션 목록</h2>
              <details class="filter-menu">
                <summary aria-label="필터"></summary>
                <div class="filter-panel">
                  <label>세션<select id="sessionFilter"><option value="all">전체</option></select></label>
                  <label>세션 유형<select id="sessionTypeFilter"><option value="all">전체</option><option value="diagnostic">진단평가</option><option value="practice">문제풀이</option><option value="study_plan">학습계획 문제 풀이</option></select></label>
                  <label>시대<select id="eraFilter"><option value="all">전체</option></select></label>
                  <label>주제<select id="topicFilter"><option value="all">전체</option></select></label>
                  <label>유형<select id="typeFilter"><option value="all">전체</option></select></label>
                </div>
              </details>
            </div>
            <div class="note-list" id="noteList"></div>
          </div>
        </aside>

        <article class="question-note" aria-label="문제 내용">
          <div class="note-heading">
            <strong id="noteQuestionNumber">문항 0</strong>
            <span id="noteScore">-</span>
          </div>
          <div class="question-card">
            <span class="question-meta" id="noteMeta">-</span>
            <h2 id="questionTitle">표시할 문제가 없습니다.</h2>
            <p id="questionSource">문제를 풀거나 결과 화면에서 문제를 저장하면 이곳에서 확인할 수 있습니다.</p>
          </div>
          <ol class="choice-list" id="choiceList"></ol>
        </article>

        <article class="explain-note" aria-label="정오답 및 해설">
          <div class="answer-ribbon">
            <span>정답 여부</span>
            <strong id="resultBadge">-</strong>
            <span class="time-pill" id="timeSpentBadge">00:00</span>
          </div>
          <div class="answer-detail">
            <span>사용자 답안 <b id="userAnswerBadge">-</b></span>
            <span>정답 <b id="correctAnswerBadge">-</b></span>
          </div>
          <div class="explain-tabs" role="tablist" aria-label="설명 탭">
            <button class="active" type="button" data-tab="solution">해설</button>
            <button type="button" data-tab="wrong">오답</button>
            <button type="button" data-tab="concept">키워드</button>
          </div>
          <div class="explain-body">
            <h2 id="explainTitle">해설</h2>
            <div class="explain-text" id="explainText">노트가 비어 있습니다.</div>
          </div>
        </article>
      </div>
    </section>

    <div class="weak-practice-modal is-hidden" id="weakPracticeModal" role="dialog" aria-modal="true" aria-labelledby="weakPracticeTitle">
      <section class="weak-practice-dialog">
        <header>
          <div>
            <span>오답 노트 복습</span>
            <h2 id="weakPracticeTitle">오답 문제 몰아 풀기</h2>
          </div>
          <button type="button" id="closeWeakPracticeModal" aria-label="닫기">×</button>
        </header>
        <div class="weak-practice-body" id="weakPracticeBody"></div>
        <footer>
          <button class="outline-button" id="cancelWeakPracticeButton" type="button">취소</button>
          <button class="primary-button" id="startWeakPracticeButton" type="button">문제 풀이 시작</button>
        </footer>
      </section>
    </div>
  </main>

  {{ note_payload|json_script:"notePayload" }}

  <script>
    const QUESTION_CONDITION_STORAGE_KEY = "questionGenerationCondition:{{ request.user.user_id|escapejs }}";
    const QUESTION_PROGRESS_STORAGE_KEY = "questionInProgress:{{ request.user.user_id|escapejs }}";
    sessionStorage.removeItem("questionGenerationCondition");
    localStorage.removeItem("questionInProgress");

    const payload = JSON.parse(document.getElementById("notePayload").textContent);
    let records = payload.records || [];
    const sessions = payload.sessions || [];
    let activeTab = "wrong";
    let activeExplainTab = "solution";
    let activeId = records[0]?.id || null;

    const noteList = document.getElementById("noteList");
    const noteLayout = document.querySelector(".note-layout");
    const noteSidebarToggle = document.getElementById("noteSidebarToggle");
    const choiceList = document.getElementById("choiceList");
    const noteMeta = document.getElementById("noteMeta");
    const noteQuestionNumber = document.getElementById("noteQuestionNumber");
    const noteScore = document.getElementById("noteScore");
    const questionTitle = document.getElementById("questionTitle");
    const questionSource = document.getElementById("questionSource");
    const explainTitle = document.getElementById("explainTitle");
    const explainText = document.getElementById("explainText");
    const correctAnswerBadge = document.getElementById("correctAnswerBadge");
    const userAnswerBadge = document.getElementById("userAnswerBadge");
    const resultBadge = document.getElementById("resultBadge");
    const timeSpentBadge = document.getElementById("timeSpentBadge");
    const listTitle = document.getElementById("listTitle");
    const deleteButton = document.getElementById("deleteButton");
    const sessionFilter = document.getElementById("sessionFilter");
    const sessionTypeFilter = document.getElementById("sessionTypeFilter");
    const eraFilter = document.getElementById("eraFilter");
    const topicFilter = document.getElementById("topicFilter");
    const typeFilter = document.getElementById("typeFilter");
    const wrongPracticeButton = document.getElementById("wrongPracticeButton");
    const weakPracticeModal = document.getElementById("weakPracticeModal");
    const closeWeakPracticeModal = document.getElementById("closeWeakPracticeModal");
    const cancelWeakPracticeButton = document.getElementById("cancelWeakPracticeButton");
    const startWeakPracticeButton = document.getElementById("startWeakPracticeButton");
    const weakPracticeBody = document.getElementById("weakPracticeBody");
    let latestWeakPracticeRequest = null;

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function assetUrl(path) {
      if (!path) return "";
      if (/^(https?:)?\/\//.test(path) || path.startsWith("/")) return path;
      return `/${path}`;
    }

    function getCookie(name) {
      return document.cookie
        .split(";")
        .map((item) => item.trim())
        .find((item) => item.startsWith(`${name}=`))
        ?.split("=")[1] || "";
    }

    function weakPracticeParams() {
      return {
        session_id: sessionFilter.value,
        session_type: sessionTypeFilter.value,
        era: eraFilter.value,
        topic: topicFilter.value,
        q_type: typeFilter.value,
      };
    }

    function buildWeakPracticeQuery(params) {
      const query = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value && value !== "all") query.set(key, value);
      });
      return query.toString();
    }

    function closeWeakPractice() {
      weakPracticeModal?.classList.add("is-hidden");
    }

    function renderWeakPracticeModal(payload) {
      const availableCount = payload.available_count || 0;
      const requestedCounts = payload.requested_counts || [10, 30, 50];
      const includeCorrected = Boolean(payload.include_corrected);
      const selectedCount = latestWeakPracticeRequest?.count || requestedCounts[0];
      weakPracticeBody.innerHTML = `
        <p class="weak-practice-summary">현재 필터 조건에서 오답으로 기록된 문항을 다시 풉니다.</p>
        <section class="wrong-practice-option-group" aria-label="복습 범위 선택">
          <strong>복습 범위</strong>
          <label class="wrong-practice-option">
            <input type="radio" name="includeCorrected" value="false" ${includeCorrected ? "" : "checked"}>
            <span>오답 맞춘 문제 제거</span>
          </label>
          <label class="wrong-practice-option">
            <input type="radio" name="includeCorrected" value="true" ${includeCorrected ? "checked" : ""}>
            <span>오답 맞춘 문제 포함</span>
          </label>
        </section>
        <section class="wrong-practice-option-group" aria-label="문항 수 선택">
          <strong>문항 수</strong>
          <div class="wrong-practice-counts">
            ${requestedCounts.map((count) => `
              <label class="wrong-practice-option">
                <input type="radio" name="practiceCount" value="${count}" ${Number(selectedCount) === Number(count) ? "checked" : ""}>
                <span>${count}문항</span>
              </label>
            `).join("")}
          </div>
        </section>
        <p class="weak-practice-notice">최근 풀이에서 맞힌 문항은 기본적으로 제외합니다.</p>
        <strong class="weak-practice-total">현재 출제 가능 문항: ${availableCount}문항</strong>
      `;
      weakPracticeBody.querySelectorAll("input[name='includeCorrected']").forEach((input) => {
        input.addEventListener("change", () => {
          refreshWeakPracticeAvailability().catch((error) => {
            alert(error.message || "오답 문항 수를 확인하지 못했습니다.");
          });
        });
      });
      weakPracticeBody.querySelectorAll("input[name='practiceCount']").forEach((input) => {
        input.addEventListener("change", () => {
          latestWeakPracticeRequest.count = Number(input.value);
          updateWeakPracticeStartState();
        });
      });
      latestWeakPracticeRequest.available_count = availableCount;
      updateWeakPracticeStartState();
      weakPracticeModal?.classList.remove("is-hidden");
    }

    function updateWeakPracticeStartState() {
      if (!latestWeakPracticeRequest) return;
      const requestedCount = Number(latestWeakPracticeRequest.count || 10);
      const availableCount = Number(latestWeakPracticeRequest.available_count || 0);
      startWeakPracticeButton.disabled = availableCount < requestedCount;
      startWeakPracticeButton.textContent = availableCount < requestedCount
        ? `문항 부족 (${availableCount}/${requestedCount})`
        : "문제 풀이 시작";
    }

    async function refreshWeakPracticeAvailability() {
      const selectedMode = weakPracticeBody.querySelector("input[name='includeCorrected']:checked");
      latestWeakPracticeRequest.include_corrected = selectedMode?.value === "true";
      const query = buildWeakPracticeQuery(latestWeakPracticeRequest);
      const response = await fetch(`/question/api/wrong-note/recommendation/${query ? `?${query}` : ""}`, {
        credentials: "same-origin",
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || "오답 문항 수를 확인하지 못했습니다.");
      }
      renderWeakPracticeModal(payload);
    }

    async function hasInProgressPracticeSession() {
      const response = await fetch("/question/api/sessions/in-progress/", {
        credentials: "same-origin",
      });
      if (!response.ok) return false;
      const payload = await response.json().catch(() => ({}));
      return (payload.sessions || []).length > 0;
    }

    async function openWeakPracticeModal() {
      if (activeTab !== "wrong") {
        alert("오답 노트에서만 문제 풀이를 생성할 수 있습니다.");
        return;
      }
      if (!filteredRecords().length) {
        alert("현재 조건에 해당하는 오답 문항이 없습니다.");
        return;
      }

      wrongPracticeButton.disabled = true;
      latestWeakPracticeRequest = {
        ...weakPracticeParams(),
        count: 10,
        include_corrected: false,
      };
      try {
        const query = buildWeakPracticeQuery(latestWeakPracticeRequest);
        const response = await fetch(`/question/api/wrong-note/recommendation/${query ? `?${query}` : ""}`, {
          credentials: "same-origin",
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || "오답 문항 수를 확인하지 못했습니다.");
        }
        renderWeakPracticeModal(payload);
      } catch (error) {
        alert(error.message || "오답 문항 수를 확인하지 못했습니다.");
      } finally {
        wrongPracticeButton.disabled = false;
      }
    }

    async function startWeakPractice() {
      if (!latestWeakPracticeRequest) return;
      startWeakPracticeButton.disabled = true;
      try {
        if (await hasInProgressPracticeSession()) {
          const shouldCreateNew = confirm("풀다 만 문제가 있습니다. 새 문제를 생성하면 기존 진행 기록은 삭제됩니다. 계속하시겠습니까?");
          if (!shouldCreateNew) {
            startWeakPracticeButton.disabled = false;
            return;
          }
        }

        const response = await fetch("/question/api/wrong-note/start/", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": decodeURIComponent(getCookie("csrftoken")),
          },
          body: JSON.stringify(latestWeakPracticeRequest),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || "문제를 생성하지 못했습니다.");
        }
        localStorage.removeItem(QUESTION_PROGRESS_STORAGE_KEY);
        sessionStorage.removeItem(QUESTION_CONDITION_STORAGE_KEY);
        window.location.href = `/question/exam/?resume=1&session_id=${payload.session_id}`;
      } catch (error) {
        alert(error.message || "문제를 생성하지 못했습니다.");
        startWeakPracticeButton.disabled = false;
      }
    }

    function uniqueValues(field) {
      return [...new Set(records.map((record) => record[field]).filter(Boolean))].sort();
    }

    function fillSelect(select, values, labeler = (value) => value) {
      select.querySelectorAll("option:not([value='all'])").forEach((option) => option.remove());
      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = labeler(value);
        select.appendChild(option);
      });
    }

    function initFilters() {
      fillSelect(sessionFilter, sessions.map((session) => String(session.sessionId)), (value) => {
        const session = sessions.find((item) => String(item.sessionId) === value);
        return session
          ? `${session.recordedDate || session.label} · ${session.sessionTypeLabel || session.sessionType} (${session.totalCount}문항)`
          : value;
      });
      fillSelect(eraFilter, uniqueValues("era"));
      fillSelect(topicFilter, uniqueValues("topic"));
      fillSelect(typeFilter, uniqueValues("type"));
    }

    function recordsForTab() {
      if (activeTab === "wrong") return records.filter((record) => !record.isCorrect);
      if (activeTab === "saved") return records.filter((record) => record.isSaved);
      return records;
    }

    function matchesFilters(record, includeSession = true) {
      const sessionMatched = !includeSession || sessionFilter.value === "all" || String(record.sessionId) === sessionFilter.value;
      const sessionTypeMatched = sessionTypeFilter.value === "all" || record.sessionType === sessionTypeFilter.value;
      const eraMatched = eraFilter.value === "all" || record.era === eraFilter.value;
      const topicMatched = topicFilter.value === "all" || record.topic === topicFilter.value;
      const typeMatched = typeFilter.value === "all" || record.type === typeFilter.value;
      return sessionMatched && sessionTypeMatched && eraMatched && topicMatched && typeMatched;
    }

    function filteredRecords() {
      return recordsForTab().filter((record) => matchesFilters(record));
    }

    function currentRecord() {
      return filteredRecords().find((record) => record.id === activeId) || filteredRecords()[0] || null;
    }

    function renderTabs() {
      document.querySelectorAll("[data-note-tab]").forEach((button) => {
        button.classList.toggle("active", button.dataset.noteTab === activeTab);
      });
      document.querySelectorAll(".explain-tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === activeExplainTab);
      });
    }

    function renderList() {
      const list = filteredRecords();
      listTitle.textContent = activeTab === "wrong"
        ? "오답 노트"
        : activeTab === "saved"
          ? "저장 노트"
          : "문항 목록";
      noteList.innerHTML = list.length ? list.map((record) => `
        <button class="${record.id === activeId ? "active" : ""}" type="button" data-id="${record.id}">
          <span>${escapeHtml(record.sessionTypeLabel || record.sessionType)} · ${escapeHtml(record.era)} · ${escapeHtml(record.topic)} · ${escapeHtml(record.type)}</span>
          <strong>${record.number}번. ${escapeHtml(record.title)}</strong>
          <em>${record.isCorrect ? "정답" : "오답"} · ${record.isSaved ? "저장됨" : "미저장"} · ${record.timeSpent}</em>
        </button>
      `).join("") : `<p class="empty-list">조건에 맞는 문항이 없습니다.</p>`;

      noteList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          activeId = Number(button.dataset.id);
          activeExplainTab = "solution";
          render();
        });
      });
    }

    function answerLabel(value) {
      return value ? `${value}번` : "미응답";
    }

    function renderDetail() {
      const record = currentRecord();
      if (!record) {
        noteMeta.textContent = "-";
        noteQuestionNumber.textContent = "문항 0";
        noteScore.textContent = "-";
        questionTitle.textContent = "표시할 문제가 없습니다.";
        questionSource.textContent = "문제를 풀거나 결과 화면에서 문제를 저장하면 이곳에서 확인할 수 있습니다.";
        choiceList.innerHTML = "";
        correctAnswerBadge.textContent = "-";
        userAnswerBadge.textContent = "-";
        resultBadge.textContent = "-";
        resultBadge.className = "";
        timeSpentBadge.textContent = "00:00";
        explainTitle.textContent = "해설";
        explainText.textContent = "노트가 비어 있습니다.";
        deleteButton.disabled = true;
        return;
      }

      activeId = record.id;
      noteMeta.textContent = `${record.era} · ${record.topic} · ${record.type}${record.subtype ? ` · ${record.subtype}` : ""}`;
      noteQuestionNumber.textContent = `문항 ${record.number}`;
      noteScore.textContent = `${record.score}점`;
      correctAnswerBadge.textContent = answerLabel(record.answer);
      userAnswerBadge.textContent = answerLabel(record.userAnswer);
      resultBadge.textContent = record.isCorrect ? "정답" : "오답";
      resultBadge.className = `result-state ${record.isCorrect ? "correct" : "wrong"}`;
      timeSpentBadge.textContent = record.timeSpent;
      questionTitle.textContent = record.title;
      const source = record.source || "별도 지문이 없는 문제입니다.";
      const questionImage = record.questionImagePath
        ? `<img class="note-question-image" src="${escapeHtml(assetUrl(record.questionImagePath))}" alt="문항 자료 이미지">`
        : "";
      questionSource.innerHTML = `${escapeHtml(source)}${questionImage}`;
      choiceList.classList.toggle(
        "has-image-choices",
        record.choices.some((choice) => Boolean(choice.imagePath)),
      );
      choiceList.innerHTML = record.choices.map((choice) => {
        const classes = [
          choice.number === record.answer ? "correct" : "",
          choice.number === record.userAnswer ? "selected" : "",
          choice.imagePath ? "has-image" : "",
        ].filter(Boolean).join(" ");
        const choiceImage = choice.imagePath
          ? `<img class="note-choice-image" src="${escapeHtml(assetUrl(choice.imagePath))}" alt="${choice.number}번 선택지 이미지">`
          : "";
        const choiceText = choice.content ? `<b>${escapeHtml(choice.content)}</b>` : "";
        return `<li class="${classes}"><span>${choice.number}</span><div class="note-choice-body">${choiceImage}${choiceText}</div></li>`;
      }).join("");

      const wrongItems = record.wrongs?.length
        ? record.wrongs
        : record.choices
            .filter((choice) => choice.number !== record.answer)
            .map((choice) => `${choice.number}번: ${choice.explanation || "정답 조건과 맞지 않는 선택지입니다."}`);
      const tabMap = {
        solution: ["해설", `<p>${escapeHtml(record.solution || "해설이 없습니다.")}</p>`],
        wrong: ["오답", `<ul class="wrong-explain-list">${wrongItems.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`],
        concept: ["키워드", `<p>${escapeHtml(record.concept || "핵심 개념이 없습니다.")}</p>`],
      };
      explainTitle.textContent = tabMap[activeExplainTab][0];
      explainText.innerHTML = tabMap[activeExplainTab][1];
      deleteButton.disabled = !record.isSaved;
    }

    function render() {
      if (!filteredRecords().some((record) => record.id === activeId)) {
        activeId = filteredRecords()[0]?.id || null;
      }
      wrongPracticeButton.disabled = activeTab !== "wrong" || filteredRecords().length === 0;
      renderTabs();
      renderList();
      renderDetail();
    }

    async function toggleSaved(record, isSaved) {
      const response = await fetch(`/question/api/session/${record.sessionId}/note/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": decodeURIComponent(getCookie("csrftoken")),
        },
        body: JSON.stringify({
          question_id: record.questionId,
          is_saved: isSaved,
        }),
      });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error || "저장 상태 변경에 실패했습니다.");
      }
    }

    noteSidebarToggle.addEventListener("click", () => {
      const collapsed = noteLayout.classList.toggle("is-sidebar-collapsed");
      noteSidebarToggle.classList.toggle("is-active", !collapsed);
      noteSidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      noteSidebarToggle.setAttribute("aria-label", collapsed ? "사이드바 펼치기" : "사이드바 접기");
    });

    deleteButton.addEventListener("click", async () => {
      const record = currentRecord();
      if (!record || !record.isSaved) return;
      deleteButton.disabled = true;
      try {
        await toggleSaved(record, false);
        record.isSaved = false;
        render();
      } catch (error) {
        alert(error.message || "저장 해제에 실패했습니다.");
      } finally {
        deleteButton.disabled = false;
      }
    });

    wrongPracticeButton.addEventListener("click", openWeakPracticeModal);
    startWeakPracticeButton.addEventListener("click", startWeakPractice);
    closeWeakPracticeModal.addEventListener("click", closeWeakPractice);
    cancelWeakPracticeButton.addEventListener("click", closeWeakPractice);
    weakPracticeModal.addEventListener("click", (event) => {
      if (event.target === weakPracticeModal) {
        closeWeakPractice();
      }
    });

    document.querySelectorAll("[data-note-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        activeTab = button.dataset.noteTab;
        activeId = filteredRecords()[0]?.id || null;
        render();
      });
    });

    document.querySelectorAll(".explain-tabs button").forEach((button) => {
      button.addEventListener("click", () => {
        activeExplainTab = button.dataset.tab;
        render();
      });
    });

    [sessionFilter, sessionTypeFilter, eraFilter, topicFilter, typeFilter].forEach((select) => {
      select.addEventListener("change", () => {
        activeId = filteredRecords()[0]?.id || null;
        render();
      });
    });

    document.addEventListener("click", (event) => {
      const filterMenu = document.querySelector(".filter-menu");
      if (!filterMenu?.open) return;
      const filterPanel = filterMenu.querySelector(".filter-panel");
      const filterButton = filterMenu.querySelector("summary");
      if (filterPanel?.contains(event.target) || filterButton?.contains(event.target)) return;
      filterMenu.removeAttribute("open");
    });

    initFilters();
    render();
  </script>
</body>
</html>
