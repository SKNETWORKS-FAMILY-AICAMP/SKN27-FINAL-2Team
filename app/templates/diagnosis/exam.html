<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 진단평가</title>
  <link rel="stylesheet" href="/static/question/css/exam.css" />
  <link rel="stylesheet" href="../../static/question/css/exam.css" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css?v=exam-card-align-4" />
</head>
<body>
  <header class="site-header" aria-label="진단평가 메뉴">
    <a class="brand site-brand" href="/" aria-label="himate 홈">himate</a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a class="active" href="/diagnosis/">진단 평가</a>
      <a href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a href="/analytics/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      {% if request.user.is_authenticated %}
      <form class="logout-form" method="post" action="{% url 'user:logout' %}">
        {% csrf_token %}
        <button class="ghost-button" type="submit">로그아웃</button>
      </form>
      {% else %}
        <a class="pill-button" href="/user/login/">로그인</a>
      {% endif %}
    </nav>
  </header>

  <main class="exam-page">
    <section class="exam-shell" aria-label="진단평가 문제 풀이">
      <header class="exam-header">
        <div class="exam-title">
          <h1>진단 평가</h1>
        </div>
        <section class="timer-card header-timer" aria-label="남은 시간">
          <span>남은 시간</span>
          <strong id="timerText">80:00</strong>
        </section>
        <div class="progress-box" aria-label="문항 진행률">
          <strong>문제 진행률</strong>
          <div class="progress-track"><span id="progressFill" style="width: 5%"></span></div>
          <em id="progressText">1 / 50</em>
        </div>
        <a class="exit-top-button header-exit" href="/diagnosis/">나가기</a>
      </header>

      <div class="exam-layout">
        <section class="question-panel">
          <article class="question-card">
            <div class="question-card-meta">
              <span class="question-badge" id="questionBadge">문항 번호 1</span>
              <span class="question-meta-right">
                <span class="question-type-chip" id="questionType">유형</span>
                <span class="question-score" id="questionScore">0점</span>
              </span>
            </div>
            <h2 id="questionTitle"></h2>
            <div class="question-source" id="questionSource"></div>
            <div class="choice-list" id="choiceList" role="radiogroup" aria-label="선택지"></div>
          </article>

          <footer class="question-actions">
            <button class="nav-button" id="prevButton" type="button">이전</button>
            <button class="submit-button" id="submitButton" type="button">제출</button>
            <button class="nav-button next" id="nextButton" type="button">다음</button>
          </footer>
        </section>

        <aside class="side-panel" aria-label="진단평가 상태">
          <section class="number-card">
            <h2>문항 목록</h2>
            <div class="number-grid" id="numberGrid" aria-label="문항 번호"></div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const DIAGNOSIS_STORAGE_KEY = "diagnosisSession:{{ request.user.user_id|escapejs }}";
    sessionStorage.removeItem("diagnosisSession");

    document.querySelectorAll("img[data-fallback-src]").forEach((image) => {
      image.addEventListener("error", () => {
        if (image.dataset.fallbackTried) return;
        image.dataset.fallbackTried = "1";
        image.src = image.dataset.fallbackSrc;
      });
    });

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return null;
    }

    // ── 세션 데이터 로드 ──────────────────────────────────────────────────────────
    const sessionData = JSON.parse(sessionStorage.getItem(DIAGNOSIS_STORAGE_KEY) || "null");
    if (!sessionData || !sessionData.questions) {
      alert("세션 정보가 없습니다. 다시 시작해 주세요.");
      window.location.href = "/diagnosis/";
      throw new Error("no session");
    }

    const SESSION_ID = sessionData.session_id;
    const TIME_LIMIT = sessionData.time_limit_sec || 4800;
    const startedAt = sessionData.startedAt || Date.now();

    const koreanChoiceOrder = "가나다라마";
    const choiceOrder = (choice) => {
      const marker = String(choice.content || "").match(/^\s*\(?([가나다라마])\)/)?.[1];
      const index = koreanChoiceOrder.indexOf(marker);
      return index < 0 ? Number.MAX_SAFE_INTEGER : index;
    };

    // API questions → 내부 포맷으로 변환
    const questions = sessionData.questions.map((q) => ({
      question_id: q.question_id,
      type: q.question_type,
      title: q.content,
      source: q.passage || [q.era, q.topic].filter(Boolean).join(" · "),
      q_score: q.q_score,
      choices: [...q.choices]
        .sort((a, b) => choiceOrder(a) - choiceOrder(b) || a.choice_no - b.choice_no)
        .map((choice, index) => ({ ...choice, choice_no: index + 1 })),
    }));

    // answers[i] = choice_id (선택한 선택지 ID) or null
    let currentIndex = 0;
    const answers = Array(questions.length).fill(null);

    const questionBadge = document.getElementById("questionBadge");
    const questionScore = document.getElementById("questionScore");
    const questionType = document.getElementById("questionType");
    const questionTitle = document.getElementById("questionTitle");
    const questionSource = document.getElementById("questionSource");
    const choiceList = document.getElementById("choiceList");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const numberGrid = document.getElementById("numberGrid");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const submitButton = document.getElementById("submitButton");
    const timerText = document.getElementById("timerText");

    // ── 문항 번호 그리드 생성 ──────────────────────────────────────────────────────
    numberGrid.innerHTML = questions.map((_, index) => `
      <button type="button" data-index="${index}">${index + 1}</button>
    `).join("");
    const numberButtons = [...numberGrid.querySelectorAll("button")];

    let remainingSeconds = TIME_LIMIT;
    let isTimeOver = false;

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderQuestion() {
      const question = questions[currentIndex];
      questionBadge.textContent = `문항 번호 ${currentIndex + 1}`;
      questionScore.textContent = `${question.q_score || 0}점`;
      questionType.textContent = question.type || "";
      questionTitle.textContent = question.title;
      questionSource.innerHTML = escapeHtml(question.source).replaceAll("\n", "<br>");
      progressFill.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
      progressText.textContent = `${currentIndex + 1} / ${questions.length}`;

      choiceList.innerHTML = question.choices.map((choice) => {
        const selected = answers[currentIndex] === choice.choice_id;
        return `
          <button type="button" class="choice${selected ? " selected" : ""}"
                  data-choice-id="${choice.choice_id}"
                  aria-pressed="${selected}">
            <span>${choice.choice_no}</span><div class="choice-body"><b>${escapeHtml(choice.content)}</b></div>
          </button>
        `;
      }).join("");

      numberButtons.forEach((button, index) => {
        button.classList.toggle("active", index === currentIndex);
        button.classList.toggle("answered", answers[index] !== null);
      });

      prevButton.disabled = currentIndex === 0;
      nextButton.textContent = currentIndex === questions.length - 1 ? "마지막" : "다음";
      bindChoiceButtons();
    }

    function bindChoiceButtons() {
      choiceList.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => {
          if (isTimeOver) return;
          const choiceId = Number(button.dataset.choiceId);
          // 같은 선택지 다시 클릭 → 선택 해제 (토글)
          answers[currentIndex] = answers[currentIndex] === choiceId ? null : choiceId;
          renderQuestion();
        });
      });
    }

    function moveQuestion(nextIndex) {
      if (nextIndex < 0 || nextIndex >= questions.length) return;
      currentIndex = nextIndex;
      renderQuestion();
    }

    prevButton.addEventListener("click", () => moveQuestion(currentIndex - 1));
    nextButton.addEventListener("click", () => moveQuestion(currentIndex + 1));
    numberButtons.forEach((button) => {
      button.addEventListener("click", () => moveQuestion(Number(button.dataset.index)));
    });

    // ── 제출 ──────────────────────────────────────────────────────────────────────
    submitButton.addEventListener("click", async () => {
      if (isTimeOver) return;
      if (!confirm("제출하시겠습니까? 제출 후에는 수정할 수 없습니다.")) return;

      submitButton.disabled = true;
      submitButton.textContent = "제출 중...";

      const elapsed_sec = Math.round((Date.now() - startedAt) / 1000);
      const answersPayload = questions.map((q, index) => ({
        question_id: q.question_id,
        choice_id: answers[index] ?? null,
        time_spent_ms: null,
      }));

      try {
        const res = await fetch("/diagnosis/api/submit/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify({
            session_id: SESSION_ID,
            elapsed_sec,
            answers: answersPayload,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "서버 오류");
        }

        sessionStorage.removeItem(DIAGNOSIS_STORAGE_KEY);
        window.location.href = `/diagnosis/result/?session_id=${SESSION_ID}`;
      } catch (e) {
        alert(`제출 중 오류가 발생했습니다: ${e.message}`);
        submitButton.disabled = false;
        submitButton.textContent = "제출";
      }
    });

    renderQuestion();

    // ── 타이머 ────────────────────────────────────────────────────────────────────
    function renderTimer() {
      const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
      const seconds = String(remainingSeconds % 60).padStart(2, "0");
      timerText.textContent = `${minutes}:${seconds}`;
      timerText.classList.toggle("is-warning", remainingSeconds <= 60 && remainingSeconds > 0);
    }

    function finishExamByTime() {
      isTimeOver = true;
      timerText.textContent = "00:00";
      timerText.classList.remove("is-warning");
      timerText.classList.add("is-over");
      document.querySelectorAll(".choice, .number-grid button, .nav-button, .submit-button").forEach((button) => {
        button.disabled = true;
      });
      submitButton.textContent = "시간 종료";
    }

    renderTimer();
    const timerId = setInterval(() => {
      remainingSeconds -= 1;
      if (remainingSeconds <= 0) {
        clearInterval(timerId);
        remainingSeconds = 0;
        finishExamByTime();
        return;
      }
      renderTimer();
    }, 1000);
  </script>
</body>
</html>
