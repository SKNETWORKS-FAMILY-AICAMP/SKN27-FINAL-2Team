<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>himate | 진단평가 결과</title>
  <link rel="stylesheet" href="/static/diagnosis/css/result.css" />
  <link rel="stylesheet" href="../../static/diagnosis/css/result.css" />
  <link rel="stylesheet" href="/static/himate.css" />
  <link rel="stylesheet" href="/static/layout.css" />
</head>
<body>
  <header class="site-header" aria-label="진단평가 결과 메뉴">
    <a class="brand" href="/" aria-label="himate 홈">himate</a>
    <nav class="main-nav" aria-label="학습 메뉴">
      <a class="active" href="/diagnosis/">진단 평가</a>
      <a href="/question/">문제 풀이</a>
      <a href="/chatbot/">챗봇</a>
      <a href="/analytics/mypage/">나의 학습실</a>
    </nav>
    <nav class="header-actions" aria-label="계정 메뉴">
      {% if request.user.is_authenticated %}
        <a class="ghost-button" href="/user/logout/">로그아웃</a>
      {% else %}
        <a class="pill-button" href="/user/login/">로그인</a>
      {% endif %}
    </nav>
  </header>

  <main class="result-page">
    <div id="loadingMsg" style="text-align:center;padding:4rem;">결과를 불러오는 중...</div>

    <section class="review-shell" id="reviewShell" aria-label="문제별 해설" style="display:none;">
      <header class="review-top">
        <div>
          <span class="page-kicker">진단평가 해설</span>
          <h1>문제별 결과 확인</h1>
        </div>
        <div class="question-jump" id="questionJump" aria-label="문제 번호 이동"></div>
      </header>

      <section class="answer-summary" aria-label="답안 요약">
        <article>
          <span>문제 번호</span>
          <strong id="questionNumber">1번</strong>
        </article>
        <article>
          <span>결과</span>
          <strong id="resultState">정답</strong>
        </article>
        <article>
          <span>사용자 답안</span>
          <strong id="userAnswer">-</strong>
        </article>
        <article>
          <span>정답</span>
          <strong id="correctAnswer">-</strong>
        </article>
      </section>

      <section class="question-box" aria-label="문제 내용">
        <div class="box-heading">
          <span>문제</span>
          <strong id="questionType"></strong>
        </div>
        <h2 id="questionTitle"></h2>
        <p id="questionSource"></p>
        <div class="question-passage" id="questionPassage" hidden></div>
        <div class="question-visual-note" id="questionVisualNote" hidden></div>
        <ol class="choice-review" id="choiceReview"></ol>
      </section>

      <section class="explain-grid" aria-label="해설 상세">
        <article>
          <h2>해설</h2>
          <p id="explanation"></p>
        </article>
        <article>
          <h2>챗봇</h2>
          <p id="chatbotLink"></p>
        </article>
      </section>

      <nav class="review-actions" aria-label="해설 이동">
        <button class="outline-button" id="prevQuestion" type="button">이전 문제</button>
        <button class="outline-button" id="nextQuestion" type="button">다음 문제</button>
        <button class="dark-button" id="wrongOnly" type="button">틀린 문제 보기</button>
        <button class="primary-button" id="pdfSave" type="button">오답노트 저장</button>
      </nav>
    </section>

    <section class="diagnosis-summary" id="diagnosisSummary" aria-label="전체 진단 결과" style="display:none;">
      <div class="summary-copy">
        <span class="page-kicker">진단 결과</span>
        <p>풀었던 문제 전체를 기반으로 현재 수준, 정답률, 취약 유형을 요약합니다.</p>
      </div>
      <div class="summary-grid">
        <article>
          <span>현재 수준</span>
          <strong id="levelText" style="color: red;">-</strong>
          <p id="levelDescription"></p>
        </article>
        <article>
          <span>정답률</span>
          <strong id="accuracyText" style="color: red;">0%</strong>
          <p id="accuracyCount">0 / 0</p>
        </article>
        <article>
          <span>취약 TOP 3</span>
          <ul id="weakTopics"></ul>
        </article>
      </div>
    </section>
  </main>

  <script>
    // ── URL에서 session_id 추출 ────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const SESSION_ID = params.get("session_id");
    if (!SESSION_ID) {
      alert("세션 정보가 없습니다. 진단평가를 다시 시작해 주세요.");
      window.location.href = "/diagnosis/";
      throw new Error("no session_id");
    }

    // ── 데이터 ────────────────────────────────────────────────────────────────────
    let resultData = null;      // GET /api/result/<id>/
    let explanations = [];      // GET /api/result/<id>/explanation/<qid>/ × N
    let currentIndex = 0;
    let wrongMode = false;

    // ── 데이터 로드 ──────────────────────────────────────────────────────────────
    async function loadAll() {
      // 1) 결과 요약
      const resResult = await fetch(`/diagnosis/api/result/${SESSION_ID}/`);
      if (!resResult.ok) throw new Error("결과를 불러올 수 없습니다.");
      resultData = await resResult.json();

      // 2) 문항별 해설 (병렬)
      explanations = await Promise.all(
        resultData.question_ids.map((qid) =>
          fetch(`/diagnosis/api/result/${SESSION_ID}/explanation/${qid}/`)
            .then((r) => r.json())
        )
      );

      init();
    }

    // ── 초기화 ────────────────────────────────────────────────────────────────────
    function init() {
      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("reviewShell").style.display = "";
      document.getElementById("diagnosisSummary").style.display = "";

      renderSummary();
      renderJump();
      renderQuestion();
    }

    // ── 요약 렌더링 ──────────────────────────────────────────────────────────────
    function renderSummary() {
      const { correct_count, total_count, total_score, expected_grade, era_analytics, type_analytics } = resultData;
      const accuracy = total_count ? Math.round((correct_count / total_count) * 100) : 0;

      document.getElementById("levelText").textContent = expected_grade;
      document.getElementById("accuracyText").textContent = `${accuracy}%`;
      document.getElementById("accuracyCount").textContent = `${correct_count} / ${total_count}`;

      const gradeDesc = {
        "1급": "상위권 수준입니다. 고난도 사료와 시대 통합 문제를 보완하세요.",
        "2급": "기본 개념은 안정적입니다. 오답 문제의 시대 구분과 제도명을 보완하세요.",
        "3급": "핵심 흐름은 잡혀 있습니다. 취약 시대를 중심으로 복습하세요.",
        "과락": "핵심 개념부터 다시 정리하는 것이 좋습니다.",
      };
      document.getElementById("levelDescription").textContent = gradeDesc[expected_grade] || "";

      // 취약 TOP3: wrong_rate 높은 순
      const allAnalytics = [...(era_analytics || []), ...(type_analytics || [])];
      const weakTop3 = allAnalytics
        .sort((a, b) => b.wrong_rate - a.wrong_rate)
        .slice(0, 3)
        .map((a) => a.label);
      const topics = weakTop3.length ? weakTop3 : ["데이터 없음"];
      document.getElementById("weakTopics").innerHTML = topics.map((t) => `<li>${t}</li>`).join("");
    }

    // ── 문항 번호 점프 ────────────────────────────────────────────────────────────
    function renderJump() {
      const questionJump = document.getElementById("questionJump");
      questionJump.innerHTML = explanations.map((exp, index) => `
        <button class="${index === currentIndex ? "active" : ""} ${exp.is_correct ? "correct" : "wrong"}"
                type="button" data-index="${index}">
          ${index + 1}
        </button>
      `).join("");

      questionJump.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          currentIndex = Number(button.dataset.index);
          renderQuestion();
        });
      });
    }

    // ── 문제 렌더링 ──────────────────────────────────────────────────────────────
    function answerLabel(value) {
      return value != null ? `${value}번` : "미응답";
    }

    function renderQuestion() {
      const exp = explanations[currentIndex];

      document.getElementById("questionNumber").textContent = `${currentIndex + 1}번`;
      document.getElementById("resultState").textContent = exp.is_correct ? "정답" : "오답";
      document.getElementById("resultState").className = exp.is_correct ? "is-correct" : "is-wrong";
      document.getElementById("userAnswer").textContent = answerLabel(exp.user_choice_no);
      document.getElementById("correctAnswer").textContent = answerLabel(exp.correct_choice_no);

      document.getElementById("questionType").textContent = exp.question_type || "";
      document.getElementById("questionTitle").textContent = exp.content;
      document.getElementById("questionSource").textContent = [exp.era, exp.topic].filter(Boolean).join(" · ");
      const questionPassage = document.getElementById("questionPassage");
      const questionVisualNote = document.getElementById("questionVisualNote");
      questionPassage.textContent = exp.passage || "";
      questionPassage.hidden = !exp.passage;
      questionVisualNote.textContent = exp.visual_note || "";
      questionVisualNote.hidden = !exp.visual_note;

      document.getElementById("choiceReview").innerHTML = exp.choices.map((choice) => {
        const classes = [
          choice.choice_no === exp.correct_choice_no ? "correct" : "",
          choice.choice_no === exp.user_choice_no ? "selected" : "",
        ].filter(Boolean).join(" ");
        return `<li class="${classes}"><span>${choice.choice_no}</span><b>${choice.content}</b></li>`;
      }).join("");

      document.getElementById("explanation").textContent =
        exp.answer_explanation || `${answerLabel(exp.correct_choice_no)}이 정답입니다.`;

      const chatbotLink = document.getElementById("chatbotLink");
      chatbotLink.innerHTML = `<a href="${exp.chatbot_url}">이 문제 챗봇에게 질문하기 →</a>`;

      renderJump();
    }

    // ── 이전/다음/틀린문제 ────────────────────────────────────────────────────────
    function move(delta) {
      const targets = wrongMode
        ? explanations.map((_, i) => i).filter((i) => !explanations[i].is_correct)
        : explanations.map((_, i) => i);
      const pos = Math.max(0, targets.indexOf(currentIndex));
      const nextPos = Math.min(Math.max(pos + delta, 0), targets.length - 1);
      currentIndex = targets[nextPos] ?? currentIndex;
      renderQuestion();
    }

    document.getElementById("prevQuestion").addEventListener("click", () => move(-1));
    document.getElementById("nextQuestion").addEventListener("click", () => move(1));
    document.getElementById("wrongOnly").addEventListener("click", (event) => {
      wrongMode = !wrongMode;
      event.currentTarget.classList.toggle("active", wrongMode);
      if (wrongMode) {
        const firstWrong = explanations.findIndex((e) => !e.is_correct);
        if (firstWrong >= 0) currentIndex = firstWrong;
      }
      renderQuestion();
    });
    document.getElementById("pdfSave").addEventListener("click", () => window.print());

    // ── 로드 시작 ─────────────────────────────────────────────────────────────────
    loadAll().catch((e) => {
      document.getElementById("loadingMsg").textContent = `오류: ${e.message}`;
    });
  </script>
</body>
</html>
