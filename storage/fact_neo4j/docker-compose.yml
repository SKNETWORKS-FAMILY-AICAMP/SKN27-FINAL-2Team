name: skn27-fact-neo4j

services:
  fact-neo4j:
    image: neo4j:5.26.28-community
    container_name: skn27-fact-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_dbms_memory_transaction_total_max: ${NEO4J_TX_MEMORY_MAX:-1G}
      TZ: Asia/Seoul
    ports:
      - "${FACT_NEO4J_HTTP_PORT:-7475}:7474"
      - "${FACT_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - fact_neo4j_data:/data
      - fact_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u \"${NEO4J_USER}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  fact_neo4j_data:
    name: skn27-fact-neo4j-data
  fact_neo4j_logs:
    name: skn27-fact-neo4j-logs
