services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skn27-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-history_rag}
      POSTGRES_USER: ${POSTGRES_USER:-himate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-himate1234}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  neo4j:
    image: neo4j:5-community
    container_name: skn27-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-himate1234}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      TZ: Asia/Seoul
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - rag-network

networks:
  rag-network:
    name: skn27-rag-network
    driver: bridge

volumes:
  postgres_data:
    name: skn27-postgres-data
  neo4j_data:
    name: skn27-neo4j-data
  neo4j_logs:
    name: skn27-neo4j-logs
  neo4j_import:
    name: skn27-neo4j-import
  neo4j_plugins:
    name: skn27-neo4j-plugins
