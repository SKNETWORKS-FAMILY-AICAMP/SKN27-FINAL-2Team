name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ${{ secrets.CI_DJANGO_SECRET_KEY }}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${{ vars.CI_DJANGO_ALLOWED_HOSTS }}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.CI_DJANGO_CSRF_TRUSTED_ORIGINS }}

  POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
  POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check Django configuration
        run: python app/manage.py check

      - name: Check migrations
        run: python app/manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python app/manage.py collectstatic --noinput

      - name: Run Django tests
        run: python app/manage.py test

      - name: Verify Docker build
        run: docker build -t himate-ci:${{ github.sha }} .

  neo4j-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Neo4j preprocessing regression tests
        run: python -m unittest discover -s test/MK/test_neo4j -p "test_*.py"

  neo4j-integration:
    runs-on: ubuntu-latest
    env:
      RUN_NEO4J_INTEGRATION: "true"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-neo4j-password

    services:
      neo4j:
        image: neo4j:5.26.28-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: pip install -r requirements/base.txt

      - name: Run Neo4j graph service integration test
        run: python test/MK/test_neo4j/test_graph_service_integration.py
