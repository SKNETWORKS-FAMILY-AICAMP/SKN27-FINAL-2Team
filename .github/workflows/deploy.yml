name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate image build variables
        run: |
          for variable_name in \
            AWS_REGION \
            AWS_DEPLOY_ROLE_ARN \
            ECR_REPOSITORY
          do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing GitHub variable: ${variable_name}"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

  deploy-to-ec2:
    if: github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_WEB_CONTAINER_NAME: ${{ vars.EC2_WEB_CONTAINER_NAME }}
      EC2_WEB_HOST_PORT: ${{ vars.EC2_WEB_HOST_PORT }}
      EC2_WEB_CONTAINER_PORT: ${{ vars.EC2_WEB_CONTAINER_PORT }}
      EC2_WEB_ENV_FILE: ${{ vars.EC2_WEB_ENV_FILE }}
      ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
      IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate EC2 deployment variables
        run: |
          for variable_name in \
            EC2_INSTANCE_ID \
            EC2_WEB_CONTAINER_NAME \
            EC2_WEB_HOST_PORT \
            EC2_WEB_CONTAINER_PORT \
            EC2_WEB_ENV_FILE \
            ECR_REGISTRY \
            IMAGE_URI
          do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing GitHub variable: ${variable_name}"
              exit 1
            fi
          done

      - name: Deploy image to GPU EC2 with SSM
        run: |
          SSM_PARAMETERS="$(
            jq -nc \
              --arg region "${AWS_REGION}" \
              --arg registry "${ECR_REGISTRY}" \
              --arg image "${IMAGE_URI}" \
              --arg container "${EC2_WEB_CONTAINER_NAME}" \
              --arg host_port "${EC2_WEB_HOST_PORT}" \
              --arg container_port "${EC2_WEB_CONTAINER_PORT}" \
              --arg env_file "${EC2_WEB_ENV_FILE}" \
              '{
                commands: [
                  "set -eu",
                  (
                    "aws ecr get-login-password --region "
                    + ($region | @sh)
                    + " | docker login --username AWS --password-stdin "
                    + ($registry | @sh)
                  ),
                  ("docker pull " + ($image | @sh)),
                  (
                    "docker rm -f "
                    + ($container | @sh)
                    + " 2>/dev/null || true"
                  ),
                  (
                    "docker run -d --name "
                    + ($container | @sh)
                    + " --restart unless-stopped --env-file "
                    + ($env_file | @sh)
                    + " -p "
                    + (($host_port + ":" + $container_port) | @sh)
                    + " "
                    + ($image | @sh)
                  )
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy HiMate web ${GITHUB_SHA}" \
              --parameters "${SSM_PARAMETERS}" \
              --query "Command.CommandId" \
              --output text
          )"

          if ! aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"
          then
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"
