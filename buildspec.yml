version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - |
        set -euo pipefail

        required_variables=(
          AWS_DEFAULT_REGION
          CODEBUILD_RESOLVED_SOURCE_VERSION
          ECR_REPOSITORY
          ECR_MAX_CRITICAL_FINDINGS
          ECR_MAX_HIGH_FINDINGS
          EC2_WEB_CONTAINER_NAME
          EC2_WEB_DOCKER_NETWORK
          EC2_WEB_BIND_HOST
          EC2_WEB_HOST_PORT
          EC2_WEB_CONTAINER_PORT
          EC2_WEB_ENV_FILE
          EC2_WEB_SSM_PARAMETER_PREFIX
          EC2_WEB_HEALTH_TIMEOUT_SECONDS
          EC2_WEB_HEALTH_POLL_SECONDS
          EC2_WEB_MEMORY_LIMIT
          EC2_WEB_CPU_LIMIT
          EC2_WEB_PIDS_LIMIT
          EC2_WEB_TMPFS_SIZE
          EC2_WEB_SERVER_NAME
          EC2_WEB_NGINX_CONFIG_PATH
          EC2_WEB_TLS_CERTIFICATE_PATH
          EC2_WEB_TLS_PRIVATE_KEY_PATH
          EC2_WEB_CERTBOT_WEBROOT
          EC2_WEB_CERTBOT_RENEWAL_HOOK_PATH
          EC2_WEB_PRIVATE_NETWORK_CIDR
        )

        for variable_name in "${required_variables[@]}"; do
          if [[ -z "${!variable_name:-}" ]]; then
            echo "Missing CodeBuild environment variable: ${variable_name}" >&2
            exit 1
          fi
        done

        if [[ ! "${CODEBUILD_RESOLVED_SOURCE_VERSION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "CODEBUILD_RESOLVED_SOURCE_VERSION must be a full 40-character Git commit SHA." >&2
          exit 1
        fi

        if [[ ! "${ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
          echo "ECR_REPOSITORY has an invalid repository name." >&2
          exit 1
        fi

        if [[ ! "${ECR_MAX_CRITICAL_FINDINGS}" =~ ^[0-9]+$ ]] \
          || [[ ! "${ECR_MAX_HIGH_FINDINGS}" =~ ^[0-9]+$ ]]; then
          echo "ECR vulnerability thresholds must be non-negative numbers." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_CONTAINER_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
          echo "EC2_WEB_CONTAINER_NAME has an invalid Docker container name." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_DOCKER_NETWORK}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
          echo "EC2_WEB_DOCKER_NETWORK has an invalid Docker network name." >&2
          exit 1
        fi

        if [[ "${EC2_WEB_BIND_HOST}" != "127.0.0.1" ]]; then
          echo "EC2_WEB_BIND_HOST must be 127.0.0.1 behind the local HTTPS proxy." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_HOST_PORT}" =~ ^[0-9]+$ ]] \
          || (( EC2_WEB_HOST_PORT < 1 || EC2_WEB_HOST_PORT > 65535 )); then
          echo "EC2_WEB_HOST_PORT must be between 1 and 65535." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_CONTAINER_PORT}" =~ ^[0-9]+$ ]] \
          || (( EC2_WEB_CONTAINER_PORT < 1 || EC2_WEB_CONTAINER_PORT > 65535 )); then
          echo "EC2_WEB_CONTAINER_PORT must be between 1 and 65535." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_ENV_FILE}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
          echo "EC2_WEB_ENV_FILE must be an absolute Linux path without whitespace." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_SSM_PARAMETER_PREFIX}" =~ ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]; then
          echo "EC2_WEB_SSM_PARAMETER_PREFIX must be an absolute SSM parameter path." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_SERVER_NAME}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
          echo "EC2_WEB_SERVER_NAME must be one explicit DNS name." >&2
          exit 1
        fi

        nginx_path_variables=(
          EC2_WEB_NGINX_CONFIG_PATH
          EC2_WEB_TLS_CERTIFICATE_PATH
          EC2_WEB_TLS_PRIVATE_KEY_PATH
          EC2_WEB_CERTBOT_WEBROOT
          EC2_WEB_CERTBOT_RENEWAL_HOOK_PATH
        )

        for variable_name in "${nginx_path_variables[@]}"; do
          if [[ ! "${!variable_name}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "${variable_name} must be an absolute Linux path without whitespace." >&2
            exit 1
          fi
        done

        if [[ ! "${EC2_WEB_PRIVATE_NETWORK_CIDR}" =~ ^([0-9]{1,3}[.]){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$ ]]; then
          echo "EC2_WEB_PRIVATE_NETWORK_CIDR must be an IPv4 CIDR." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_HEALTH_TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]] \
          || (( EC2_WEB_HEALTH_TIMEOUT_SECONDS < 60 \
            || EC2_WEB_HEALTH_TIMEOUT_SECONDS > 240 )); then
          echo "EC2_WEB_HEALTH_TIMEOUT_SECONDS must be between 60 and 240." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_HEALTH_POLL_SECONDS}" =~ ^[0-9]+$ ]] \
          || (( EC2_WEB_HEALTH_POLL_SECONDS < 1 \
            || EC2_WEB_HEALTH_POLL_SECONDS > 30 )); then
          echo "EC2_WEB_HEALTH_POLL_SECONDS must be between 1 and 30." >&2
          exit 1
        fi

        if (( EC2_WEB_HEALTH_POLL_SECONDS >= EC2_WEB_HEALTH_TIMEOUT_SECONDS )); then
          echo "EC2_WEB_HEALTH_POLL_SECONDS must be shorter than the health timeout." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_MEMORY_LIMIT}" =~ ^[1-9][0-9]*(m|g)$ ]] \
          || [[ ! "${EC2_WEB_TMPFS_SIZE}" =~ ^[1-9][0-9]*(m|g)$ ]]; then
          echo "Docker memory and tmpfs limits must use a positive m or g suffix." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_CPU_LIMIT}" =~ ^[0-9]+([.][0-9]+)?$ ]] \
          || [[ "${EC2_WEB_CPU_LIMIT}" =~ ^0+([.]0+)?$ ]]; then
          echo "EC2_WEB_CPU_LIMIT must be a positive number." >&2
          exit 1
        fi

        if [[ ! "${EC2_WEB_PIDS_LIMIT}" =~ ^[0-9]+$ ]] \
          || (( EC2_WEB_PIDS_LIMIT < 32 || EC2_WEB_PIDS_LIMIT > 4096 )); then
          echo "EC2_WEB_PIDS_LIMIT must be between 32 and 4096." >&2
          exit 1
        fi

        umask 077
        docker_config_directory="$(mktemp -d)"
        ecr_check_error_file=""
        test_database_container=""
        test_network=""
        export DOCKER_CONFIG="${docker_config_directory}"

        cleanup_build_files() {
          if [[ -n "${test_database_container}" ]]; then
            docker rm --force "${test_database_container}" > /dev/null 2>&1 || true
          fi
          if [[ -n "${test_network}" ]]; then
            docker network rm "${test_network}" > /dev/null 2>&1 || true
          fi
          if [[ -n "${ecr_registry:-}" ]]; then
            docker logout "${ecr_registry}" > /dev/null 2>&1 || true
          fi
          rm -f -- \
            "${ecr_check_error_file:-}" \
            "${docker_config_directory}/config.json"
          rmdir -- "${docker_config_directory}" > /dev/null 2>&1 || true
        }

        trap cleanup_build_files EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM

        aws_account_id="$(
          aws sts get-caller-identity \
            --query "Account" \
            --output text
        )"
        repository_mutability="$(
          aws ecr describe-repositories \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-names "${ECR_REPOSITORY}" \
            --query "repositories[0].imageTagMutability" \
            --output text
        )"
        if [[ "${repository_mutability}" != "IMMUTABLE" ]]; then
          echo "ECR repository image tags must be immutable." >&2
          exit 1
        fi

        registry_scan_type="$(
          aws ecr get-registry-scanning-configuration \
            --region "${AWS_DEFAULT_REGION}" \
            --query "scanningConfiguration.scanType" \
            --output text
        )"
        if [[ "${registry_scan_type}" != "ENHANCED" ]]; then
          echo "ECR enhanced scanning must be enabled for the registry." >&2
          exit 1
        fi

        image_tag="${CODEBUILD_RESOLVED_SOURCE_VERSION,,}"
        ecr_registry="${aws_account_id}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        tagged_image_uri="${ecr_registry}/${ECR_REPOSITORY}:${image_tag}"
        ecr_check_error_file="$(mktemp)"
        image_exists="false"
        image_missing="false"

        if aws ecr describe-images \
          --region "${AWS_DEFAULT_REGION}" \
          --repository-name "${ECR_REPOSITORY}" \
          --image-ids "imageTag=${image_tag}" \
          > /dev/null 2> "${ecr_check_error_file}"; then
          image_exists="true"
        elif grep -q "ImageNotFoundException" "${ecr_check_error_file}"; then
          image_missing="true"
        fi

        if [[ "${image_exists}" == "true" ]]; then
          echo "Reusing existing immutable ECR image: ${tagged_image_uri}"
        elif [[ "${image_missing}" == "true" ]]; then
          echo "Building ECR image: ${tagged_image_uri}"
        fi

        if [[ "${image_exists}" != "true" && "${image_missing}" != "true" ]]; then
          cat "${ecr_check_error_file}" >&2
          rm -f "${ecr_check_error_file}"
          exit 1
        fi

        rm -f "${ecr_check_error_file}"
        ecr_check_error_file=""

        aws ecr get-login-password \
          --region "${AWS_DEFAULT_REGION}" \
          | docker login \
            --username AWS \
            --password-stdin \
            "${ecr_registry}"

        if [[ "${image_missing}" == "true" ]]; then
          docker build \
            --label "org.opencontainers.image.revision=${image_tag}" \
            --tag "${tagged_image_uri}" \
            .
        elif [[ "${image_exists}" == "true" ]]; then
          docker pull "${tagged_image_uri}"
        fi

        image_revision="$(
          docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "${tagged_image_uri}"
        )"
        if [[ "${image_revision}" != "${image_tag}" ]]; then
          echo "Container image revision label does not match the source commit." >&2
          exit 1
        fi

        test_network="himate-build-${image_tag:0:12}"
        test_database_container="${test_network}-postgres"
        test_database_name="himate_ci"
        test_database_user="himate_ci"
        test_database_password="$(
          printf '%s' "${CODEBUILD_BUILD_ID:-${image_tag}}" \
            | sha256sum \
            | cut -d' ' -f1
        )"
        test_secret_key="${test_database_password}${test_database_password}"
        test_postgres_image="pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb"

        docker network create "${test_network}" > /dev/null
        docker run \
          --detach \
          --name "${test_database_container}" \
          --network "${test_network}" \
          --env "POSTGRES_DB=${test_database_name}" \
          --env "POSTGRES_USER=${test_database_user}" \
          --env "POSTGRES_PASSWORD=${test_database_password}" \
          "${test_postgres_image}" \
          > /dev/null

        database_ready="false"
        for _attempt in $(seq 1 30); do
          if docker exec \
            "${test_database_container}" \
            pg_isready \
            --dbname "${test_database_name}" \
            --username "${test_database_user}" \
            > /dev/null 2>&1; then
            database_ready="true"
            break
          fi
          sleep 2
        done
        if [[ "${database_ready}" != "true" ]]; then
          echo "CodeBuild PostgreSQL test service did not become ready." >&2
          exit 1
        fi

        test_environment=(
          --env "DJANGO_SECRET_KEY=${test_secret_key}"
          --env "DJANGO_DEBUG=false"
          --env "DJANGO_ALLOWED_HOSTS=localhost,testserver"
          --env "DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost"
          --env "DJANGO_SECURE_SSL_REDIRECT=false"
          --env "POSTGRES_DB=${test_database_name}"
          --env "POSTGRES_HOST=${test_database_container}"
          --env "POSTGRES_USER=${test_database_user}"
          --env "POSTGRES_PASSWORD=${test_database_password}"
          --env "POSTGRES_PORT=5432"
          --env "POSTGRES_SSLMODE=disable"
          --env "NEO4J_URI=bolt://localhost:7687"
          --env "NEO4J_USER=neo4j"
          --env "NEO4J_PASSWORD=codebuild-neo4j-password"
          --env "OPENAI_API_KEY=codebuild-openai-key"
        )

        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${tagged_image_uri}" \
          python app/manage.py check
        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${tagged_image_uri}" \
          python app/manage.py makemigrations --check --dry-run
        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${tagged_image_uri}" \
          python app/manage.py test \
            diagnosis \
            chatbot \
            analytics \
            question \
            user \
            config.test_health \
            config.test_database_schema \
            --noinput

        if [[ "${image_missing}" == "true" ]]; then
          docker push "${tagged_image_uri}"
        fi
        docker logout "${ecr_registry}" > /dev/null 2>&1 || true

        image_digest="$(
          aws ecr describe-images \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${image_tag}" \
            --query "imageDetails[0].imageDigest" \
            --output text
        )"

        if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "ECR returned an invalid image digest." >&2
          exit 1
        fi

        image_uri="${ecr_registry}/${ECR_REPOSITORY}@${image_digest}"
        echo "Waiting for ECR image scanning: ${image_uri}"
        scan_status=""
        scan_completed_at=""
        for _attempt in $(seq 1 60); do
          if scan_details="$(
            aws ecr describe-image-scan-findings \
              --region "${AWS_DEFAULT_REGION}" \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageDigest=${image_digest}" \
              --query "[imageScanStatus.status, imageScanFindings.imageScanCompletedAt]" \
              --output text \
              2> /dev/null
          )"; then
            read -r scan_status scan_completed_at <<< "${scan_details}"
            if [[ ( "${scan_status}" == "COMPLETE" || "${scan_status}" == "ACTIVE" ) \
              && -n "${scan_completed_at}" \
              && "${scan_completed_at}" != "None" ]]; then
              break
            elif [[ "${scan_status}" == "FAILED" \
              || "${scan_status}" == "UNSUPPORTED_IMAGE" \
              || "${scan_status}" == "SCAN_ELIGIBILITY_EXPIRED" \
              || "${scan_status}" == "FINDINGS_UNAVAILABLE" \
              || "${scan_status}" == "LIMIT_EXCEEDED" \
              || "${scan_status}" == "IMAGE_ARCHIVED" ]]; then
              echo "ECR image scan failed with status: ${scan_status}" >&2
              exit 1
            fi
          fi
          sleep 5
        done
        if [[ ( "${scan_status}" != "COMPLETE" && "${scan_status}" != "ACTIVE" ) \
          || -z "${scan_completed_at}" \
          || "${scan_completed_at}" == "None" ]]; then
          echo "ECR image scan did not become ready." >&2
          exit 1
        fi

        scan_counts="$(
          aws ecr describe-image-scan-findings \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageDigest=${image_digest}" \
            --query '[imageScanFindings.findingSeverityCounts.CRITICAL || `0`, imageScanFindings.findingSeverityCounts.HIGH || `0`]' \
            --output text
        )"
        read -r critical_findings high_findings <<< "${scan_counts}"

        if [[ ! "${critical_findings}" =~ ^[0-9]+$ ]] \
          || [[ ! "${high_findings}" =~ ^[0-9]+$ ]]; then
          echo "ECR returned invalid vulnerability counts." >&2
          exit 1
        fi

        if (( critical_findings > ECR_MAX_CRITICAL_FINDINGS )) \
          || (( high_findings > ECR_MAX_HIGH_FINDINGS )); then
          echo \
            "ECR vulnerability gate failed: critical=${critical_findings}, high=${high_findings}" \
            >&2
          exit 1
        fi

        printf '%s\n' \
          "AWS_REGION=${AWS_DEFAULT_REGION}" \
          "ECR_REGISTRY=${ecr_registry}" \
          "IMAGE_TAG=${image_tag}" \
          "IMAGE_DIGEST=${image_digest}" \
          "IMAGE_URI=${image_uri}" \
          "EC2_WEB_CONTAINER_NAME=${EC2_WEB_CONTAINER_NAME}" \
          "EC2_WEB_DOCKER_NETWORK=${EC2_WEB_DOCKER_NETWORK}" \
          "EC2_WEB_BIND_HOST=${EC2_WEB_BIND_HOST}" \
          "EC2_WEB_HOST_PORT=${EC2_WEB_HOST_PORT}" \
          "EC2_WEB_CONTAINER_PORT=${EC2_WEB_CONTAINER_PORT}" \
          "EC2_WEB_ENV_FILE=${EC2_WEB_ENV_FILE}" \
          "EC2_WEB_SSM_PARAMETER_PREFIX=${EC2_WEB_SSM_PARAMETER_PREFIX}" \
          "EC2_WEB_HEALTH_TIMEOUT_SECONDS=${EC2_WEB_HEALTH_TIMEOUT_SECONDS}" \
          "EC2_WEB_HEALTH_POLL_SECONDS=${EC2_WEB_HEALTH_POLL_SECONDS}" \
          "EC2_WEB_MEMORY_LIMIT=${EC2_WEB_MEMORY_LIMIT}" \
          "EC2_WEB_CPU_LIMIT=${EC2_WEB_CPU_LIMIT}" \
          "EC2_WEB_PIDS_LIMIT=${EC2_WEB_PIDS_LIMIT}" \
          "EC2_WEB_TMPFS_SIZE=${EC2_WEB_TMPFS_SIZE}" \
          "EC2_WEB_SERVER_NAME=${EC2_WEB_SERVER_NAME}" \
          "EC2_WEB_NGINX_CONFIG_PATH=${EC2_WEB_NGINX_CONFIG_PATH}" \
          "EC2_WEB_TLS_CERTIFICATE_PATH=${EC2_WEB_TLS_CERTIFICATE_PATH}" \
          "EC2_WEB_TLS_PRIVATE_KEY_PATH=${EC2_WEB_TLS_PRIVATE_KEY_PATH}" \
          "EC2_WEB_CERTBOT_WEBROOT=${EC2_WEB_CERTBOT_WEBROOT}" \
          "EC2_WEB_CERTBOT_RENEWAL_HOOK_PATH=${EC2_WEB_CERTBOT_RENEWAL_HOOK_PATH}" \
          "EC2_WEB_PRIVATE_NETWORK_CIDR=${EC2_WEB_PRIVATE_NETWORK_CIDR}" \
          > deployment/release.env

artifacts:
  files:
    - deployspec.yml
    - deployment/deploy.sh
    - deployment/nginx.conf.template
    - deployment/release.env
  discard-paths: no
