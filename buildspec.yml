version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - |
        set -euo pipefail

        required_variables=(
          AWS_DEFAULT_REGION
          CODEBUILD_RESOLVED_SOURCE_VERSION
          ECR_REPOSITORY
          ECR_MAX_CRITICAL_FINDINGS
          ECR_MAX_HIGH_FINDINGS
          ECS_APP_CONTAINER_NAME
          ECS_NGINX_CONTAINER_NAME
          ECS_CLUSTER
          ECS_MIGRATION_TASK_FAMILY
          ECS_TASK_EXECUTION_ROLE_ARN
          ECS_TASK_ROLE_ARN
          ECS_SSM_PARAMETER_PREFIX
          ECS_LOG_GROUP
        )

        for variable_name in "${required_variables[@]}"; do
          if [[ -z "${!variable_name:-}" ]]; then
            echo "Missing CodeBuild environment variable: ${variable_name}" >&2
            exit 1
          fi
        done

        if [[ ! "${CODEBUILD_RESOLVED_SOURCE_VERSION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "CODEBUILD_RESOLVED_SOURCE_VERSION must be a full 40-character Git commit SHA." >&2
          exit 1
        fi

        if [[ ! "${ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
          echo "ECR_REPOSITORY has an invalid repository name." >&2
          exit 1
        fi

        if [[ ! "${ECR_MAX_CRITICAL_FINDINGS}" =~ ^[0-9]+$ ]] \
          || [[ ! "${ECR_MAX_HIGH_FINDINGS}" =~ ^[0-9]+$ ]]; then
          echo "ECR vulnerability thresholds must be non-negative numbers." >&2
          exit 1
        fi

        for container_name in \
          "${ECS_APP_CONTAINER_NAME}" \
          "${ECS_NGINX_CONTAINER_NAME}"; do
          if [[ ! "${container_name}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,254}$ ]]; then
            echo "ECS container names contain unsupported characters." >&2
            exit 1
          fi
        done

        if [[ ! "${ECS_CLUSTER}" =~ ^[A-Za-z0-9_-]{1,255}$ ]] \
          || [[ ! "${ECS_MIGRATION_TASK_FAMILY}" =~ ^[A-Za-z0-9_-]{1,255}$ ]]; then
          echo "ECS cluster and task family names contain unsupported characters." >&2
          exit 1
        fi

        role_arn_pattern='^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
        if [[ ! "${ECS_TASK_EXECUTION_ROLE_ARN}" =~ ${role_arn_pattern} ]] \
          || [[ ! "${ECS_TASK_ROLE_ARN}" =~ ${role_arn_pattern} ]]; then
          echo "ECS task role values must be full IAM role ARNs." >&2
          exit 1
        fi

        if [[ ! "${ECS_SSM_PARAMETER_PREFIX}" =~ ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]; then
          echo "ECS_SSM_PARAMETER_PREFIX must be an absolute SSM parameter path." >&2
          exit 1
        fi

        if [[ ! "${ECS_LOG_GROUP}" =~ ^/[A-Za-z0-9_./#-]+$ ]]; then
          echo "ECS_LOG_GROUP contains unsupported characters." >&2
          exit 1
        fi

        for command_name in aws chmod docker grep mktemp openssl python3 sed sha256sum; do
          if ! command -v "${command_name}" > /dev/null 2>&1; then
            echo "Required CodeBuild command is not installed: ${command_name}" >&2
            exit 1
          fi
        done

        umask 077
        docker_config_directory="$(mktemp -d)"
        ecr_check_error_file=""
        migration_run_output=""
        migration_task_file=""
        nginx_test_tls_directory=""
        test_database_container=""
        test_network=""
        export DOCKER_CONFIG="${docker_config_directory}"

        cleanup_build_files() {
          if [[ -n "${test_database_container}" ]]; then
            docker rm --force "${test_database_container}" > /dev/null 2>&1 || true
          fi
          if [[ -n "${test_network}" ]]; then
            docker network rm "${test_network}" > /dev/null 2>&1 || true
          fi
          if [[ -n "${ecr_registry:-}" ]]; then
            docker logout "${ecr_registry}" > /dev/null 2>&1 || true
          fi
          rm -f -- \
            "${ecr_check_error_file:-}" \
            "${migration_run_output:-}" \
            "${migration_task_file:-}" \
            "${docker_config_directory}/config.json"
          if [[ -n "${nginx_test_tls_directory}" ]]; then
            chmod 0700 "${nginx_test_tls_directory}" > /dev/null 2>&1 || true
            rm -f -- \
              "${nginx_test_tls_directory}/fullchain.pem" \
              "${nginx_test_tls_directory}/privkey.pem"
            rmdir -- "${nginx_test_tls_directory}" > /dev/null 2>&1 || true
          fi
          rmdir -- "${docker_config_directory}" > /dev/null 2>&1 || true
        }

        trap cleanup_build_files EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM

        aws_account_id="$(
          aws sts get-caller-identity \
            --query "Account" \
            --output text
        )"
        repository_mutability="$(
          aws ecr describe-repositories \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-names "${ECR_REPOSITORY}" \
            --query "repositories[0].imageTagMutability" \
            --output text
        )"
        if [[ "${repository_mutability}" != "IMMUTABLE" ]]; then
          echo "ECR repository image tags must be immutable." >&2
          exit 1
        fi

        repository_scan_on_push="$(
          aws ecr describe-repositories \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-names "${ECR_REPOSITORY}" \
            --query "repositories[0].imageScanningConfiguration.scanOnPush" \
            --output text
        )"
        if [[ "${repository_scan_on_push,,}" != "true" ]]; then
          echo "ECR repository scan on push must be enabled." >&2
          exit 1
        fi

        image_tag="${CODEBUILD_RESOLVED_SOURCE_VERSION,,}"
        nginx_image_tag="${image_tag}-nginx"
        ecr_registry="${aws_account_id}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        repository_uri="${ecr_registry}/${ECR_REPOSITORY}"
        app_tagged_image_uri="${repository_uri}:${image_tag}"
        nginx_tagged_image_uri="${repository_uri}:${nginx_image_tag}"

        aws ecr get-login-password \
          --region "${AWS_DEFAULT_REGION}" \
          | docker login \
            --username AWS \
            --password-stdin \
            "${ecr_registry}"

        prepare_image() {
          local context_path="$1"
          local dockerfile_path="$2"
          local image_uri="$3"
          local image_tag_value="$4"
          local -n image_state_reference="$5"

          ecr_check_error_file="$(mktemp)"
          if aws ecr describe-images \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${image_tag_value}" \
            > /dev/null 2> "${ecr_check_error_file}"; then
            image_state_reference="existing"
            echo "Reusing existing immutable ECR image: ${image_uri}"
            docker pull "${image_uri}"
          elif grep -q "ImageNotFoundException" "${ecr_check_error_file}"; then
            image_state_reference="new"
            echo "Building ECR image: ${image_uri}"
            docker build \
              --label "org.opencontainers.image.revision=${image_tag}" \
              --file "${dockerfile_path}" \
              --tag "${image_uri}" \
              "${context_path}"
          else
            cat "${ecr_check_error_file}" >&2
            exit 1
          fi

          rm -f "${ecr_check_error_file}"
          ecr_check_error_file=""

          image_revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "${image_uri}"
          )"
          if [[ "${image_revision}" != "${image_tag}" ]]; then
            echo "Container image revision label does not match the source commit: ${image_uri}" >&2
            exit 1
          fi
        }

        app_image_state=""
        prepare_image \
          "." \
          "Dockerfile" \
          "${app_tagged_image_uri}" \
          "${image_tag}" \
          app_image_state

        test_network="himate-build-${image_tag:0:12}"
        test_database_container="${test_network}-postgres"
        test_database_name="himate_ci"
        test_database_user="himate_ci"
        test_database_password="$(
          printf '%s' "${CODEBUILD_BUILD_ID:-${image_tag}}" \
            | sha256sum \
            | cut -d' ' -f1
        )"
        test_secret_key="${test_database_password}${test_database_password}"
        test_postgres_image="pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb"

        docker network create "${test_network}" > /dev/null
        docker run \
          --detach \
          --name "${test_database_container}" \
          --network "${test_network}" \
          --env "POSTGRES_DB=${test_database_name}" \
          --env "POSTGRES_USER=${test_database_user}" \
          --env "POSTGRES_PASSWORD=${test_database_password}" \
          "${test_postgres_image}" \
          > /dev/null

        database_ready="false"
        for _attempt in $(seq 1 30); do
          if docker exec \
            "${test_database_container}" \
            pg_isready \
            --dbname "${test_database_name}" \
            --username "${test_database_user}" \
            > /dev/null 2>&1; then
            database_ready="true"
            break
          fi
          sleep 2
        done
        if [[ "${database_ready}" != "true" ]]; then
          echo "CodeBuild PostgreSQL test service did not become ready." >&2
          exit 1
        fi

        test_environment=(
          --env "DJANGO_SECRET_KEY=${test_secret_key}"
          --env "DJANGO_DEBUG=false"
          --env "DJANGO_ALLOWED_HOSTS=localhost,testserver"
          --env "DJANGO_HEALTHCHECK_HOST=localhost"
          --env "DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost"
          --env "DJANGO_SECURE_SSL_REDIRECT=false"
          --env "POSTGRES_DB=${test_database_name}"
          --env "POSTGRES_HOST=${test_database_container}"
          --env "POSTGRES_USER=${test_database_user}"
          --env "POSTGRES_PASSWORD=${test_database_password}"
          --env "POSTGRES_PORT=5432"
          --env "POSTGRES_SSLMODE=disable"
          --env "NEO4J_URI=bolt://localhost:7687"
          --env "NEO4J_USER=neo4j"
          --env "NEO4J_PASSWORD=codebuild-neo4j-password"
          --env "OPENAI_API_KEY=codebuild-openai-key"
        )

        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${app_tagged_image_uri}" \
          python app/manage.py check
        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${app_tagged_image_uri}" \
          python app/manage.py makemigrations --check --dry-run
        docker run \
          --rm \
          --network "${test_network}" \
          "${test_environment[@]}" \
          "${app_tagged_image_uri}" \
          python app/manage.py test \
            diagnosis \
            chatbot \
            analytics \
            question \
            user \
            config.test_health \
            config.test_database_schema \
            --noinput

        nginx_image_state=""
        prepare_image \
          "deployment/nginx" \
          "deployment/nginx/Dockerfile" \
          "${nginx_tagged_image_uri}" \
          "${nginx_image_tag}" \
          nginx_image_state

        nginx_test_tls_directory="$(mktemp -d)"
        openssl req \
          -x509 \
          -newkey rsa:2048 \
          -nodes \
          -days 1 \
          -subj "/CN=example.com" \
          -keyout "${nginx_test_tls_directory}/privkey.pem" \
          -out "${nginx_test_tls_directory}/fullchain.pem" \
          > /dev/null 2>&1
        chmod 0444 \
          "${nginx_test_tls_directory}/fullchain.pem" \
          "${nginx_test_tls_directory}/privkey.pem"
        chmod 0555 "${nginx_test_tls_directory}"

        docker run \
          --rm \
          --network none \
          --read-only \
          --tmpfs "/tmp:rw,nosuid,nodev,noexec,size=64m" \
          --cap-drop ALL \
          --security-opt no-new-privileges:true \
          --volume "${nginx_test_tls_directory}:/run/secrets/tls:ro" \
          --env "NGINX_SERVER_NAME=example.com" \
          --env "NGINX_UPSTREAM_HOST=127.0.0.1" \
          --env "NGINX_UPSTREAM_PORT=8000" \
          --env "NGINX_HTTP_LISTEN_PORT=8080" \
          --env "NGINX_HTTPS_LISTEN_PORT=8443" \
          --env "NGINX_TLS_CERTIFICATE_PATH=/run/secrets/tls/fullchain.pem" \
          --env "NGINX_TLS_PRIVATE_KEY_PATH=/run/secrets/tls/privkey.pem" \
          "${nginx_tagged_image_uri}" \
          --test

        if [[ "${app_image_state}" == "new" ]]; then
          docker push "${app_tagged_image_uri}"
        fi
        if [[ "${nginx_image_state}" == "new" ]]; then
          docker push "${nginx_tagged_image_uri}"
        fi

        app_image_digest="$(
          aws ecr describe-images \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${image_tag}" \
            --query "imageDetails[0].imageDigest" \
            --output text
        )"
        nginx_image_digest="$(
          aws ecr describe-images \
            --region "${AWS_DEFAULT_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${nginx_image_tag}" \
            --query "imageDetails[0].imageDigest" \
            --output text
        )"

        for image_digest_value in \
          "${app_image_digest}" \
          "${nginx_image_digest}"; do
          if [[ ! "${image_digest_value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR returned an invalid image digest." >&2
            exit 1
          fi
        done

        app_image_uri="${repository_uri}@${app_image_digest}"
        nginx_image_uri="${repository_uri}@${nginx_image_digest}"

        wait_for_image_scan() {
          local image_digest_value="$1"
          local image_label="$2"
          local scan_completed_at=""
          local scan_status=""

          echo "Waiting for ECR image scanning: ${image_label}"
          for _attempt in $(seq 1 60); do
            if scan_details="$(
              aws ecr describe-image-scan-findings \
                --region "${AWS_DEFAULT_REGION}" \
                --repository-name "${ECR_REPOSITORY}" \
                --image-id "imageDigest=${image_digest_value}" \
                --query "[imageScanStatus.status, imageScanFindings.imageScanCompletedAt]" \
                --output text \
                2> /dev/null
            )"; then
              read -r scan_status scan_completed_at <<< "${scan_details}"
              if [[ ( "${scan_status}" == "COMPLETE" || "${scan_status}" == "ACTIVE" ) \
                && -n "${scan_completed_at}" \
                && "${scan_completed_at}" != "None" ]]; then
                break
              elif [[ "${scan_status}" == "FAILED" \
                || "${scan_status}" == "UNSUPPORTED_IMAGE" \
                || "${scan_status}" == "SCAN_ELIGIBILITY_EXPIRED" \
                || "${scan_status}" == "FINDINGS_UNAVAILABLE" \
                || "${scan_status}" == "LIMIT_EXCEEDED" \
                || "${scan_status}" == "IMAGE_ARCHIVED" ]]; then
                echo "ECR image scan failed for ${image_label}: ${scan_status}" >&2
                exit 1
              fi
            fi
            sleep 5
          done

          if [[ ( "${scan_status}" != "COMPLETE" && "${scan_status}" != "ACTIVE" ) \
            || -z "${scan_completed_at}" \
            || "${scan_completed_at}" == "None" ]]; then
            echo "ECR image scan did not become ready: ${image_label}" >&2
            exit 1
          fi

          scan_counts="$(
            aws ecr describe-image-scan-findings \
              --region "${AWS_DEFAULT_REGION}" \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageDigest=${image_digest_value}" \
              --query '[imageScanFindings.findingSeverityCounts.CRITICAL || `0`, imageScanFindings.findingSeverityCounts.HIGH || `0`]' \
              --output text
          )"
          read -r critical_findings high_findings <<< "${scan_counts}"

          if [[ ! "${critical_findings}" =~ ^[0-9]+$ ]] \
            || [[ ! "${high_findings}" =~ ^[0-9]+$ ]]; then
            echo "ECR returned invalid vulnerability counts: ${image_label}" >&2
            exit 1
          fi

          if (( critical_findings > ECR_MAX_CRITICAL_FINDINGS )) \
            || (( high_findings > ECR_MAX_HIGH_FINDINGS )); then
            echo \
              "ECR vulnerability gate failed for ${image_label}: critical=${critical_findings}, high=${high_findings}" \
              >&2
            exit 1
          fi
        }

        wait_for_image_scan "${app_image_digest}" "Django application"
        wait_for_image_scan "${nginx_image_digest}" "Nginx proxy"

        migration_task_file="$(mktemp)"
        sed \
          -e "s|__ECS_MIGRATION_TASK_FAMILY__|${ECS_MIGRATION_TASK_FAMILY}|g" \
          -e "s|__ECS_TASK_EXECUTION_ROLE_ARN__|${ECS_TASK_EXECUTION_ROLE_ARN}|g" \
          -e "s|__ECS_TASK_ROLE_ARN__|${ECS_TASK_ROLE_ARN}|g" \
          -e "s|__ECS_APP_CONTAINER_NAME__|${ECS_APP_CONTAINER_NAME}|g" \
          -e "s|__APP_IMAGE_URI__|${app_image_uri}|g" \
          -e "s|__ECS_SSM_PARAMETER_PREFIX__|${ECS_SSM_PARAMETER_PREFIX}|g" \
          -e "s|__ECS_LOG_GROUP__|${ECS_LOG_GROUP}|g" \
          -e "s|__AWS_REGION__|${AWS_DEFAULT_REGION}|g" \
          deployment/ecs/migration-task-definition.json.template \
          > "${migration_task_file}"

        python3 -m json.tool "${migration_task_file}" > /dev/null
        migration_task_definition_arn="$(
          aws ecs register-task-definition \
            --cli-input-json "file://${migration_task_file}" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text
        )"

        migration_run_output="$(mktemp)"
        aws ecs run-task \
          --cluster "${ECS_CLUSTER}" \
          --launch-type EC2 \
          --task-definition "${migration_task_definition_arn}" \
          --count 1 \
          --started-by "codebuild-${image_tag:0:12}" \
          > "${migration_run_output}"

        migration_task_arn="$(
          python3 -c \
            'import json, sys; payload = json.load(open(sys.argv[1], encoding="utf-8")); tasks = payload.get("tasks", []); print(tasks[0]["taskArn"] if tasks else "")' \
            "${migration_run_output}"
        )"
        if [[ -z "${migration_task_arn}" ]]; then
          echo "ECS migration task did not start." >&2
          cat "${migration_run_output}" >&2
          exit 1
        fi

        aws ecs wait tasks-stopped \
          --cluster "${ECS_CLUSTER}" \
          --tasks "${migration_task_arn}"

        migration_exit_code="$(
          aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${migration_task_arn}" \
            --query "tasks[0].containers[?name=='${ECS_APP_CONTAINER_NAME}']|[0].exitCode" \
            --output text
        )"
        if [[ "${migration_exit_code}" != "0" ]]; then
          echo "ECS migration task failed with exit code: ${migration_exit_code}" >&2
          aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${migration_task_arn}" \
            --output json \
            >&2
          exit 1
        fi

        printf \
          '[{"name":"%s","imageUri":"%s"},{"name":"%s","imageUri":"%s"}]\n' \
          "${ECS_APP_CONTAINER_NAME}" \
          "${app_image_uri}" \
          "${ECS_NGINX_CONTAINER_NAME}" \
          "${nginx_image_uri}" \
          > "${CODEBUILD_SRC_DIR}/imagedefinitions.json"

        test -s "${CODEBUILD_SRC_DIR}/imagedefinitions.json"
        echo "Created ECS deployment artifact: ${CODEBUILD_SRC_DIR}/imagedefinitions.json"

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
